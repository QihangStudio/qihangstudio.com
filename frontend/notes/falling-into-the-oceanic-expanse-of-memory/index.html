<h1>Falling into the Oceanic Expanse of Memory</h1>
<div class="essay-body" lang="en">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="4">In a white room with blurred outlines, the boy picked up several crayons scattered beside him and colored the walls blue, gold, and green.</p>
<p data-source-paragraph="5">At that moment, the boy’s mother entered the room. Seeing that the once-white room had already been covered with colors, she did not scold the boy sitting on the floor with crayons still in his hand. The boy looked up at his mother innocently and babbled, “Mom, look! Look!”</p>
<p data-source-paragraph="6">His mother crouched down and looked at the patch of blue on the wall, formed by somewhat messy strokes. She asked gently, “Is this the sea?”</p>
<p data-source-paragraph="7">The boy looked at the blue on the wall, then back at his mother. Perhaps, for the first time, he realized that color could be called by such a name. It was not simply blue any more, nor merely blue on a wall, but blue that had been given meaning — the sea.</p>
<p data-source-paragraph="8">“The sea?” Before that word was spoken aloud, had that patch of blue already been the sea? What does painting imitate: “things as they are, or as they appear? Is it an imitation of appearance, or of reality?”</p>
<p data-source-paragraph="9"> The white room grew even more blurred, as though something were slowly drawing it away. Suddenly, I felt the ground disappear beneath my feet and fell into an entirely unfamiliar space.</p>
<p data-source-paragraph="10">Three beds stood inside the space. One appeared extraordinarily perfect, with hardly a seam to be found; its flawless form made its existence seem only natural. By comparison, the second bed was much rougher, with marks from the plane clearly visible across its wooden boards. I reached out, trying to touch the third bed, but my hand passed straight through it.</p>
<p data-source-paragraph="11">“Then,” a voice came from nearby, “would you call the painter the maker of the bed?”</p>
<p data-source-paragraph="12">“Certainly not,” another voice replied.</p>
<p data-source-paragraph="13">I followed the sound and saw two unfamiliar scholars, dressed like figures from ancient Greek sculptures, standing before the three beds. One of them did not seem interested in giving any answer immediately. He simply kept asking questions:</p>
<p data-source-paragraph="14">“Then what does the painter make?”</p>
<p data-source-paragraph="15">“The image of a bed.”</p>
<p data-source-paragraph="16">I looked again at the third bed. It still could not be touched, but somehow, its edges had begun to blur. The straight bedboards slowly curved, their wooden color swallowed by blue, until the bed disappeared altogether and only a sea unfolded before us. Perhaps I was not sleepy in the slightest; perhaps I was already in a dream.  Either way, I was no longer very interested in beds.</p>
<p data-source-paragraph="17">“Sir,” I interrupted, “what if the painter painted a sea?”</p>
<p data-source-paragraph="18">Both scholars turned toward me at once, looking slightly surprised. They had never expected my existence.</p>
<p data-source-paragraph="19">I pointed toward the blue expanse. “The sea on the wall is here, which has no tides, no salt, not even a single drop of actual seawater. Can it still be called ‘sea’?”</p>
<p data-source-paragraph="20">I had not expected the scholar who had been asking questions to give me an answer. And indeed, he responded with another question: “Then, do you think the painter paints the sea as it truly is, or as it appears to him?”</p>
<p data-source-paragraph="21">While I was still pondering, the other scholar answered first: “Just like before, Socrates, the blue on the wall is certainly not the sea. It is the image of the sea.”</p>
<p data-source-paragraph="22">“What if this painter had never seen the sea,” I pressed, “but had already known the word ‘sea’?”</p>
<p data-source-paragraph="23">The scholar paused for a moment and said, “Then, well, what he imitates would not be the real sea.”</p>
<p data-source-paragraph="24">“Then what is he imitating?”</p>
<p data-source-paragraph="25">The scholar did not answer immediately.</p>
<p data-source-paragraph="26">“Perhaps he had heard others speak of the sea,” the other scholar said. “Someone may have told him that the sea is blue, that it is an endless expanse of water; perhaps he had read stories about the sea or seen seas painted by others. Even if he had never seen the sea with his own eyes, the sea would not have been entirely unknown to him.”</p>
<p data-source-paragraph="27">“If so, the sea beneath his brush may not necessarily be the appearance of the sea itself, yet neither can we conclude that what he imitates is not the real sea. Perhaps this patch of blue is an appearance of the sea as seen by others, an appearance left behind in his own impression.”</p>
<p data-source-paragraph="28">The sea before us trembled slightly.</p>
<p data-source-paragraph="29">If the painter had never seen the real sea, then the medium between the wall and the ocean would no longer be merely a pair of eyes. People use their own eyes to describe the  “reality” they believe they see; that “reality” enters the memory of another person through language, and the “reality” they have been told is once again given shape and color through imagination. Finally, it falls onto the wall before us.</p>
<p data-source-paragraph="30">Even so, when we see that boundless expanse of blue, we still say:</p>
<p data-source-paragraph="31">“The sea.”</p>
</div>

<h1>坠入记忆的汪洋</h1>
<div class="essay-body" lang="zh-CN">
<p class="essay-byline">启航</p>
<p data-source-paragraph="3">模糊轮廓的洁白房间里，男孩拾起散落在身边的几根蜡笔，将墙壁染成了蓝色、金色与绿色。</p>
<p data-source-paragraph="4">这时，男孩的母亲走进了这个房间。看到原本洁白的房间已经被涂抹上色彩时，她却并没有责备那个正坐在地上，手中握着蜡笔的男孩。男孩天真地望向母亲，牙牙学语道：“妈妈，你看！你看！”</p>
<p data-source-paragraph="5">母亲蹲下身，看着墙壁上由略显杂乱的笔触构成的那片蓝色，她温柔地问道：“这是海？”</p>
<p data-source-paragraph="6">男孩看了看墙上的蓝色，然后又看向母亲。他也许第一次认识到颜色可以被这样称呼。不是单纯的蓝色，也不是墙壁上的蓝色，而是被赋予了意义的蓝色——海。</p>
<p data-source-paragraph="7">“海？”当这个字被说出口前，那片蓝色便已经是海了吗？绘画所模仿的事物，究竟是“它们本来的样子，还是它们呈现出的样子？是模仿表象，还是模仿真实？”</p>
<p data-source-paragraph="8">白色的房间变得更加模糊，仿佛有什么正将它一点点抽离。我顿感脚下一空，跌入了另一个完全陌生的空间。</p>
<p data-source-paragraph="9">空间内摆放着三张床。其中一张看起来异常完美，几乎找不到任何接缝，完美外形使它的存在变得理所当然。相比之下，第二张床便粗糙许多，刨削的痕迹在木质的床板上清晰可见。我伸出手，想触碰第三张床，手掌却直接穿了过去。</p>
<p data-source-paragraph="10">“那么，”声音从近处传来，“你会称画家为床的制造者吗？”</p>
<p data-source-paragraph="11">“当然不会。”另一个声音说道。</p>
<p data-source-paragraph="12">我循着声音望去，两个着装如同古希腊雕像的陌生学者正站在三张床前。其中一位似乎并不打算立刻给出任何答案。他不断发问：</p>
<p data-source-paragraph="13">“那么画家制造了什么？”</p>
<p data-source-paragraph="14">“床的形象。”</p>
<p data-source-paragraph="15">我再次看向第三张床。它仍然无法被触碰，可它的边缘却不知何时开始变得模糊。笔直的床板缓缓弯曲，木质的颜色被蓝色吞没，直到那张床彻底消失，只剩下一片海展开在我们面前。也许是我没有丝毫困意，也许是已经身处梦境之中。不论哪种情况，我现在对床没有那么感兴趣。</p>
<p data-source-paragraph="16">“先生，”我插话道，“如果画家画了一片海呢？”</p>
<p data-source-paragraph="17">两人同时转头看向我，带着些许的惊讶，他们从来没有意料到我的出现。</p>
<p data-source-paragraph="18">“喏，真正的海在那里。”我指向那片蓝色，“画布上的海在这里。没有潮汐，没有盐分，没有一滴真正的海水，它能被称作‘海’吗？”</p>
<p data-source-paragraph="19">我并没有期望方才一直提问的学者会给我一个答案。的确如此，学者发问：“那么，你认为画家笔下的是海本来的样子，还是海呈现给他的样子？”</p>
<p data-source-paragraph="20">我还在思索时，刚才另一位学者先一步回答道：“和刚才一样，苏格拉底，墙上的蓝色当然不是海，是海的形象。”</p>
<p data-source-paragraph="21">“倘若这位画家从未见过海，”我追问道，“却早已知晓‘海’这个字了呢？”</p>
<p data-source-paragraph="22">学者稍作停顿，说道：“那么，嗯，他所模仿的便不是真实的海。”</p>
<p data-source-paragraph="23">“那他模仿的是什么？”</p>
<p data-source-paragraph="24">学者没有立刻回答。</p>
<p data-source-paragraph="25">“他也许听别人说起过海，”另一位学者说道，“有人说海是蓝色的，是一望无际的水；他也许读过关于海的故事，看过他人画作下的海。即便从未亲眼见过海，他也并非对海一无所知。”</p>
<p data-source-paragraph="26">“如是，他画笔下的海并不一定是海的表象，但是我们也不能断言他模仿的并不是真正的海。也许这片蓝色是他人对于海的表象，在他的印象中留下的表象。”</p>
<p data-source-paragraph="27">眼前的海微微晃动了一下。</p>
<p data-source-paragraph="28">倘若画家从未见过真实的海，那么画布与海洋间的媒介便不只是一双眼睛。人们通过自己的双眼描述着自己认为的“真实”；这份“真实”通过语言进入另一个人的记忆，又在想象中重新被渲染上形状与颜色。最终，落在了我们面前的画布上。</p>
<p data-source-paragraph="29">即便如此，当看见那一片无垠的蓝色时，我们依然会说：</p>
<p data-source-paragraph="30">“海。”</p>
</div>

<h1>墜入記憶的汪洋</h1>
<div class="essay-body" lang="zh-Hant">
<p class="essay-byline">啟航</p>
<p data-source-paragraph="3">模糊輪廓的潔白房間里，男孩拾起散落在身邊的幾根蠟筆，將牆壁染成了藍色、金色與綠色。</p>
<p data-source-paragraph="4">這時，男孩的母親走進了這個房間。看到原本潔白的房間已經被塗抹上色彩時，她卻並沒有責備那個正坐在地上，手中握著蠟筆的男孩。男孩天真地望向母親，牙牙學語道：“媽媽，你看！你看！”</p>
<p data-source-paragraph="5">母親蹲下身，看著牆壁上由略顯雜亂的筆觸構成的那片藍色，她溫柔地問道：“這是海？”</p>
<p data-source-paragraph="6">男孩看了看牆上的藍色，然後又看向母親。他也許第一次認識到顏色可以被這樣稱呼。不是單純的藍色，也不是牆壁上的藍色，而是被賦予了意義的藍色——海。</p>
<p data-source-paragraph="7">“海？”當這個字被說出口前，那片藍色便已經是海了嗎？繪畫所模仿的事物，究竟是“它們本來的樣子，還是它們呈現出的樣子？是模仿表象，還是模仿真實？”</p>
<p data-source-paragraph="8">白色的房間變得更加模糊，彷彿有什麼正將它一點點抽離。我頓感腳下一空，跌入了另一個完全陌生的空間。</p>
<p data-source-paragraph="9">空間內擺放著三張床。其中一張看起來異常完美，幾乎找不到任何接縫，完美外形使它的存在變得理所當然。相比之下，第二張床便粗糙許多，刨削的痕跡在木質的床板上清晰可見。我伸出手，想觸碰第三張床，手掌卻直接穿了過去。</p>
<p data-source-paragraph="10">“那麼，”聲音從近處傳來，“你會稱畫家為床的製造者嗎？”</p>
<p data-source-paragraph="11">“當然不會。”另一個聲音說道。</p>
<p data-source-paragraph="12">我循著聲音望去，兩個著裝如同古希臘雕像的陌生學者正站在三張床前。其中一位似乎並不打算立刻給出任何答案。他不斷發問：</p>
<p data-source-paragraph="13">“那麼畫家製造了什麼？”</p>
<p data-source-paragraph="14">“床的形象。”</p>
<p data-source-paragraph="15">我再次看向第三張床。它仍然無法被觸碰，可它的邊緣卻不知何時開始變得模糊。筆直的床板緩緩彎曲，木質的顏色被藍色吞沒，直到那張床徹底消失，只剩下一片海展開在我們面前。也許是我沒有絲毫困意，也許是已經身處夢境之中。不論哪種情況，我現在對床沒有那麼感興趣。</p>
<p data-source-paragraph="16">“先生，”我插話道，“如果畫家畫了一片海呢？”</p>
<p data-source-paragraph="17">兩人同時轉頭看向我，帶著些許的驚訝，他們從來沒有意料到我的出現。</p>
<p data-source-paragraph="18">“喏，真正的海在那裡。”我指向那片藍色，“畫布上的海在這裡。沒有潮汐，沒有鹽分，沒有一滴真正的海水，它能被稱作‘海’嗎？”</p>
<p data-source-paragraph="19">我並沒有期望方才一直提問的學者會給我一個答案。的確如此，學者發問：“那麼，你認為畫家筆下的是海本來的樣子，還是海呈現給他的樣子？”</p>
<p data-source-paragraph="20">我還在思索時，剛才另一位學者先一步回答道：“和剛才一樣，蘇格拉底，牆上的藍色當然不是海，是海的形象。”</p>
<p data-source-paragraph="21">“倘若這位畫家從未見過海，”我追問道，“卻早已知曉‘海’這個字了呢？”</p>
<p data-source-paragraph="22">學者稍作停頓，說道：“那麼，嗯，他所模仿的便不是真實的海。”</p>
<p data-source-paragraph="23">“那他模仿的是什麼？”</p>
<p data-source-paragraph="24">學者沒有立刻回答。</p>
<p data-source-paragraph="25">“他也許聽別人說起過海，”另一位學者說道，“有人說海是藍色的，是一望無際的水；他也許讀過關於海的故事，看過他人畫作下的海。即便從未親眼見過海，他也並非對海一無所知。”</p>
<p data-source-paragraph="26">“如是，他畫筆下的海並不一定是海的表象，但是我們也不能斷言他模仿的並不是真正的海。也許這片藍色是他人對於海的表象，在他的印象中留下的表象。”</p>
<p data-source-paragraph="27">眼前的海微微晃動了一下。</p>
<p data-source-paragraph="28">倘若畫家從未見過真實的海，那麼畫布與海洋間的媒介便不只是一雙眼睛。人們通過自己的雙眼描述著自己認為的“真實”；這份“真實”通過語言進入另一個人的記憶，又在想象中重新被渲染上形狀與顏色。最終，落在了我們面前的畫布上。</p>
<p data-source-paragraph="29">即便如此，當看見那一片無垠的藍色時，我們依然會說：</p>
<p data-source-paragraph="30">“海。”</p>
</div>
</template>
<template data-essay-language="ja" data-essay-lang="ja">
<h1>記憶の大海へ落ちて</h1>
<div class="essay-body" lang="ja">
<p class="essay-byline">啓航</p>
<p data-source-paragraph="4">輪郭のぼやけた白い部屋で、男の子はそばに散らばるクレヨンを何本か拾い、壁を青と金と緑に染めた。</p>
<p data-source-paragraph="5">そのとき、男の子の母親が部屋に入ってきた。もとは白かった部屋が、もう色で覆われているのを見ても、彼女は床に座ってまだクレヨンを握っている男の子を叱らなかった。男の子は無邪気に母親を見上げ、たどたどしく言った。「ママ、見て！見て！」</p>
<p data-source-paragraph="6">母親はしゃがみ込み、少し乱れた筆触がつくる壁の青を眺めた。そして、やさしく尋ねた。「これは海？」</p>
<p data-source-paragraph="7">男の子は壁の青を見て、それからまた母親を見た。色がそのような名前で呼べるのだと、おそらく初めて知ったのだろう。それは、もはやただの青でも、壁にあるだけの青でもなく、意味を与えられた青――海だった。</p>
<p data-source-paragraph="8">「海？」その言葉が声になる前から、あの青はすでに海だったのだろうか。絵画が模倣するのは、「もののあるがままの姿か、それとも見える姿か。見かけの模倣なのか、それとも実在の模倣なのか」。</p>
<p data-source-paragraph="9">白い部屋はさらにぼやけ、何かが少しずつそれを引き離しているようだった。不意に足もとの地面がなくなり、私はまったく見知らぬ空間へ落ちていった。</p>
<p data-source-paragraph="10">そこには三つの寝台が置かれていた。一つは、継ぎ目がほとんど見つからないほどに完璧だった。その欠けるところのない形は、それが存在することを、ごく当然に思わせた。それに比べて、二つ目はずっと粗く、木の板には鉋の跡がはっきり残っていた。三つ目の寝台に触れようと手を伸ばすと、手のひらはそのまますり抜けた。</p>
<p data-source-paragraph="11">「では」と、近くから声がした。「画家を、寝台をつくる者と呼ぶだろうか？」</p>
<p data-source-paragraph="12">「もちろん、呼びません」と、別の声が答えた。</p>
<p data-source-paragraph="13">声の方を見ると、古代ギリシアの彫像のような衣をまとった、見知らぬ二人の学者が、三つの寝台の前に立っていた。一人は、すぐに何かの答えを与える気はなさそうだった。ただ、問い続けていた。</p>
<p data-source-paragraph="14">「では、画家は何をつくるのか？」</p>
<p data-source-paragraph="15">「寝台の像です。」</p>
<p data-source-paragraph="16">もう一度、三つ目の寝台を見た。やはり触れることはできなかったが、その縁が、いつの間にかぼやけ始めていた。まっすぐな板がゆっくりと曲がり、木の色が青に呑み込まれ、やがて寝台はすっかり消えた。あとには、一面の海だけが私たちの前に広がっていた。まったく眠くなかったからかもしれない。もう夢の中にいたからかもしれない。どちらにしても、いまは寝台にそれほど興味がなかった。</p>
<p data-source-paragraph="17">「先生」と、私は口を挟んだ。「画家が海を描いたら、どうでしょう？」</p>
<p data-source-paragraph="18">二人の学者は同時に振り向き、少し驚いた顔をした。私がいることなど、まるで予想していなかったのだ。</p>
<p data-source-paragraph="19">私は青い広がりを指さした。「壁の海はここにあります。潮の満ち引きも、塩分も、本物の海水の一滴さえありません。それでも『海』と呼べるのでしょうか？」</p>
<p data-source-paragraph="20">先ほどから問い続けていた学者が、答えをくれるとは思っていなかった。果たして、彼は別の問いで応じた。「では、画家が描くのは、海の本当の姿だと思うか。それとも、彼に見える海の姿だと思うか？」</p>
<p data-source-paragraph="21">私がまだ考えているうちに、もう一人の学者が先に答えた。「先ほどと同じです、ソクラテス。壁の青は、もちろん海ではありません。海の像です。」</p>
<p data-source-paragraph="22">「もしその画家が、一度も海を見たことがなく」と、私はさらに尋ねた。「それでも『海』という言葉を、すでに知っていたとしたら？」</p>
<p data-source-paragraph="23">学者は少し間を置いて言った。「それなら、そうですね、彼が模倣しているのは、本当の海ではないことになります。」</p>
<p data-source-paragraph="24">「では、何を模倣しているのでしょう？」</p>
<p data-source-paragraph="25">学者はすぐには答えなかった。</p>
<p data-source-paragraph="26">「ほかの人が海について話すのを、聞いたことがあったのかもしれない」と、もう一人の学者が言った。「海は青く、果てしなく広がる水だと、誰かに教わったのかもしれない。海の物語を読んだり、ほかの人が描いた海を見たりしたのかもしれない。自分の目で海を見たことがなくても、海について何も知らなかったわけではないだろう。」</p>
<p data-source-paragraph="27">「そうであれば、彼の筆のもとにある海は、必ずしも海そのものの見かけではないかもしれない。それでも、彼が模倣するのは本当の海ではない、と結論づけることもできない。あの青は、ほかの人の目に映った海の見かけが、彼自身の印象の中に残した、もう一つの見かけなのかもしれない。」</p>
<p data-source-paragraph="28">目の前の海が、かすかに揺れた。</p>
<p data-source-paragraph="29">もし画家が本物の海を見たことがなければ、壁と海とのあいだにある媒介は、もはや一対の目だけではない。人は自分の目で、そこに見ていると信じる「現実」を語る。その「現実」は、言葉を通って別の人の記憶へ入り、伝えられた「現実」は、想像の中で再び形と色を与えられる。そして、ついに私たちの前の壁へ落ち着くのだ。</p>
<p data-source-paragraph="30">それでも、果てのないあの青を見ると、私たちはやはりこう言う。</p>
<p data-source-paragraph="31">「海。」</p>
</div>
</template>
<template data-essay-language="fr" data-essay-lang="fr">
<h1>Tomber dans l’immensité océanique de la mémoire</h1>
<div class="essay-body" lang="fr">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="4">Dans une pièce blanche aux contours flous, le petit garçon ramassa quelques crayons éparpillés près de lui et colora les murs de bleu, d’or et de vert.</p>
<p data-source-paragraph="5">À cet instant, sa mère entra dans la pièce. Voyant les murs autrefois blancs déjà couverts de couleurs, elle ne gronda pas le garçon assis par terre, les crayons encore à la main. Il leva vers elle un regard innocent et balbutia : « Maman, regarde ! Regarde ! »</p>
<p data-source-paragraph="6">Sa mère s’accroupit et contempla la tache bleue sur le mur, faite de traits un peu désordonnés. Elle demanda doucement : « C’est la mer ? »</p>
<p data-source-paragraph="7">Le garçon regarda le bleu sur le mur, puis sa mère. Peut-être comprit-il pour la première fois qu’une couleur pouvait porter un tel nom. Ce n’était plus simplement du bleu, ni seulement du bleu sur un mur, mais un bleu auquel on avait donné un sens : la mer.</p>
<p data-source-paragraph="8">« La mer ? » Avant que ce mot soit prononcé, cette tache bleue était-elle déjà la mer ? Qu’imite la peinture : « les choses telles qu’elles sont, ou telles qu’elles apparaissent ? Est-ce une imitation de l’apparence, ou de la réalité ? »</p>
<p data-source-paragraph="9">La pièce blanche devint encore plus floue, comme si quelque chose l’éloignait lentement. Soudain, je sentis le sol se dérober sous mes pieds et tombai dans un espace entièrement inconnu.</p>
<p data-source-paragraph="10">Trois lits s’y trouvaient. L’un paraissait extraordinairement parfait, presque sans le moindre raccord ; sa forme irréprochable rendait son existence comme évidente. Le deuxième était, en comparaison, bien plus grossier : les traces du rabot restaient nettement visibles sur ses planches de bois. Je tendis la main pour toucher le troisième, mais ma paume le traversa.</p>
<p data-source-paragraph="11">« Alors, dit une voix toute proche, appellerais-tu le peintre le fabricant du lit ? »</p>
<p data-source-paragraph="12">« Certainement pas », répondit une autre voix.</p>
<p data-source-paragraph="13">Je me tournai vers les voix et vis deux savants inconnus, vêtus comme des figures de sculptures grecques antiques, debout devant les trois lits. L’un d’eux ne semblait pas pressé de donner la moindre réponse. Il ne cessait de poser des questions :</p>
<p data-source-paragraph="14">« Alors, que fabrique le peintre ? »</p>
<p data-source-paragraph="15">« L’image d’un lit. »</p>
<p data-source-paragraph="16">Je regardai de nouveau le troisième lit. On ne pouvait toujours pas le toucher, mais ses bords avaient, je ne sais quand, commencé à se brouiller. Les planches droites se courbèrent lentement, leur couleur de bois fut engloutie par le bleu, jusqu’à ce que le lit disparaisse tout à fait et qu’une mer seule se déploie devant nous. Peut-être n’avais-je pas le moindre sommeil ; peut-être étais-je déjà dans un rêve. Quoi qu’il en soit, les lits ne m’intéressaient plus beaucoup.</p>
<p data-source-paragraph="17">« Monsieur, interrompis-je, et si le peintre peignait une mer ? »</p>
<p data-source-paragraph="18">Les deux savants se tournèrent vers moi en même temps, un peu surpris. Ils ne s’étaient jamais attendus à ma présence.</p>
<p data-source-paragraph="19">Je désignai l’étendue bleue. « La mer sur le mur est ici. Elle n’a ni marées, ni sel, pas même une seule goutte d’eau de mer véritable. Peut-on encore l’appeler “mer” ? »</p>
<p data-source-paragraph="20">Je ne m’attendais pas à ce que le savant qui ne cessait de poser des questions me donne une réponse. Et, en effet, il me répondit par une nouvelle question : « Alors, penses-tu que le peintre peint la mer telle qu’elle est réellement, ou telle qu’elle lui apparaît ? »</p>
<p data-source-paragraph="21">Tandis que je réfléchissais encore, l’autre savant répondit le premier : « Comme tout à l’heure, Socrate, le bleu sur le mur n’est certainement pas la mer. C’est l’image de la mer. »</p>
<p data-source-paragraph="22">« Et si ce peintre n’avait jamais vu la mer, insistai-je, mais connaissait déjà le mot “mer” ? »</p>
<p data-source-paragraph="23">Le savant marqua une pause et dit : « Alors, eh bien, ce qu’il imite ne serait pas la vraie mer. »</p>
<p data-source-paragraph="24">« Qu’imite-t-il, alors ? »</p>
<p data-source-paragraph="25">Le savant ne répondit pas tout de suite.</p>
<p data-source-paragraph="26">« Peut-être avait-il entendu d’autres personnes parler de la mer, dit l’autre savant. Quelqu’un lui avait peut-être raconté que la mer est bleue, que c’est une étendue d’eau sans fin ; peut-être avait-il lu des histoires sur la mer ou vu des mers peintes par d’autres. Même sans avoir jamais vu la mer de ses propres yeux, il n’en aurait pas tout ignoré. »</p>
<p data-source-paragraph="27">« S’il en est ainsi, la mer sous son pinceau n’est pas nécessairement l’apparence de la mer elle-même, et pourtant nous ne pouvons pas non plus conclure que ce qu’il imite n’est pas la vraie mer. Peut-être cette tache bleue est-elle une apparence de la mer vue par d’autres, une apparence laissée dans sa propre impression. »</p>
<p data-source-paragraph="28">La mer devant nous frémit légèrement.</p>
<p data-source-paragraph="29">Si le peintre n’avait jamais vu la vraie mer, alors le médium entre le mur et l’océan ne serait plus une simple paire d’yeux. Les gens décrivent, à travers leurs propres yeux, la « réalité » qu’ils croient voir ; cette « réalité » entre par le langage dans la mémoire d’une autre personne, et la « réalité » qu’on lui a racontée reçoit à nouveau forme et couleur dans l’imagination. Enfin, elle se pose sur le mur devant nous.</p>
<p data-source-paragraph="30">Et pourtant, quand nous voyons cette immensité bleue, nous disons encore :</p>
<p data-source-paragraph="31">« La mer. »</p>
</div>
