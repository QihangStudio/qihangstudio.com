<h1>Before the Next Stroke</h1>
<div class="essay-body" lang="en">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="1">In a white room with blurred outlines, crayons of various colors were scattered around a little boy. He sat on the floor, looking left and right; faced with so many colors, he was about to make his own choice. Before long, his gaze came to rest on the blue crayon. He bent down slightly, picked up the blue crayon, and turned his head to stare at the wall. It was a clean wall, as if it were a canvas prepared especially for the boy, though his mother would certainly not agree to having the clean wall filled with discordant colors. The boy seemed to know this, and he did not grab a handful of crayons and wave them across the wall. Carefully, he picked out gold and green as well, and the three crayons, like magic wands, unfolded before him the beach as it existed in his memory.</p>
<p data-source-paragraph="2">“What is art?”</p>
<p data-source-paragraph="3">Of course, the little boy did not know the answer, or perhaps he knew something, but he was too young, and he did not yet have the language to express his understanding of “art”. For a question that even Plato and Aristotle repeatedly wrestled with, how much of a clue could a little boy who had only just begun to speak possibly have? The little boy intuitively believed that the sea should be blue and that trees should be green. As long as he drew them on paper, they existed. It was as if all of this came naturally, and beneath his brush, the little boy became the creator of it all. Slowly, streaks of color were added to the white room.</p>
<p data-source-paragraph="4">Indigo blue, azure, golden yellow, and scattered touches of green and brown, the little boy looked at his masterpiece. Suddenly, he thought of something, so he quickly stood up and ran out of the room. Immediately afterward, the outlines and colors of the room began to blur gradually.</p>
<p data-source-paragraph="5">One said that art is like a foreign language to us. To anyone encountering it for the first time, it is unfamiliar; it needs to be learned, and it needs to be approached. But if art truly is a language that needs to be learned, then what language was the child speaking, who did not even know what “art” was, yet was already drawing?</p>
<p data-source-paragraph="6">Memory is a journey across time and space, and as the white room faded away, the journey paused. That was the first time I remember picking up a drawing tool to make art, and those three crayons opened the door to the realm of art; I would often move back and forth between reality and that artistic space with curiosity, a private space that belonged to me alone. Pulling back all my thoughts, I realized that I had been sitting in front of this work for a long time. Not many people would notice the existence of this work, or perhaps they did not regard it as a work at all: a slightly timeworn semicircular arch in a historic revival style connected the two spaces, supported by two massive square piers embedded into the surrounding walls. The surface of the arch was covered with polychrome ornamentation, in which forest green, golden yellow, and brick red formed vivid and interconnected patterns of animals, plants, and geometric designs. Dim, warm light shone down from an imitation kerosene lamp directly above, falling upon the yellowed structure, while the chips and worn marks beneath the arch spoke of the long passage of time it had endured. Through the thick walls, the distant chimes of Burton Memorial Tower could be faintly heard, while the footsteps of students continued to pass beneath the archway. Hundreds of people pass through it every day, yet few stop to appreciate the structure’s exquisite decorated patterns and the low-saturation colored tiles surrounding it.</p>
<p data-source-paragraph="7">It is not art. People will overlook a tree, a trash can, or an inconspicuous stretch of road without even a streetlight, but no one will overlook the Mona Lisa. Unless… he is an old man who has already stopped in front of the painting many times; or a newborn child, without the ability to read the foreign language of art. A reasonable conjecture is this: people disregard things that have lost their sense of novelty, and these things are no longer art. No, art has always been two-way; the artistic quality of these things is not defined by “people,” but by the individual “person.” People are diverse, and so are their aesthetic judgments of things; if even one person perceives artistry in something, then that thing has at least one admirer. Now, what I can say with certainty is that the structure I have observed and appreciated—the archway of Hatcher Library—is art.</p>
<p data-source-paragraph="8">It is too rigid to define art so mathematically; after that seemingly philosophical argument, I had ignored the opposing voices. If art is a language, then perhaps there are also times when people forget how to read it.</p>
<p data-source-paragraph="9">A person will pass through many doors in a lifetime, and going out through a door is often associated with a journey, perhaps the beginning of an extraordinary story. The arch in front of me had been carefully crafted and ornamented by artisans. To an adventurer, every door is like a feast set before a glutton, as each one reveals countless possibilities within those mystery spaces. I seem to have always liked doors, not because of the doors themselves, but because I can never predict what will happen in the world beyond them. Yet that uncertainty is precisely what tempts an adventurer – especially when the door itself is so exquisite. Now, I am going to pass through this structure and step into another space. But I will not immediately enter the next journey through time and space, for a simple reason: failing to watch where you are stepping while going upstairs is not a very good strategy.</p>
<p data-source-paragraph="10">I still tripped, because thoughts are not something we can simply control at will. When the art that truly belongs within one’s system of aesthetic judgment surges into his mind, he will be swept away by that powerful force.</p>
<p data-source-paragraph="11">It was still a door: its glossy dark-brown paint, together with the shoes arranged neatly on the shoe rack, all reflected the tidy and orderly style of the woman who lived behind it. The door slowly closed, and the little cat inside walked lazily toward the inner room, unaware of the journey that the figure outside the door was about to begin. Yes, just as his name suggested, he was about to Qihang (Set the Sail. Start the voyage).</p>
<p data-source-paragraph="12">Those were three doors, and each door opened into a different space. That figure exited through two doors in succession. The first door left behind the familiar room, the little cat, and his family, while the second one left behind the familiar language, buildings, and flags. Then, he entered another door. It led to a space he never set foot in before, a country surrounded by the ocean, where every detail carried a sense of foreignness: his eyes no longer saw socialist architecture, his ears no longer heard a familiar language, and familiar flags no longer hung from the flagpoles. The door behind him gradually receded and blurred. The figure did not hesitate for long, because beyond a brand-new door, there was often something novel.</p>
<p data-source-paragraph="13">Amid the rising and falling cries of seagulls, the damp sea breeze carried a faint smell of salt marsh. In the hazy mist of early morning, two tall, upright Norfolk Island pines spread out their layered, overlapping crowns on the other side of the door. Nature became a painter, coating everything around it in harmonious tones. The figure who had just stepped through the door was captivated by the scene before him. Bending down and listening closely, he could faintly hear the slightly raspy call of a kiwi from among the dense silver ferns beaded with dew. Accompanied by the soft patter of morning dew falling onto the path, a chant woven in mist echoed around the figure. Sunlight filtered through the mist, making everything around him vague yet bright, just like the room at the very beginning – except that the space was no longer so white. The little boy, no, the teenager, had never stopped moving the brush in his hand.</p>
<p data-source-paragraph="14">At that moment, the figure seemed to understand “foreignness” better than at any other time. The language, the buildings, the plants, even the smell of the air around him no longer belonged to the world he knew. Yet strangely, he did not need anyone to teach him how to appreciate the scene before him. The two Norfolk Island pines needed no translation, and the morning mist needed no annotation. He simply stood there and looked at them.</p>
<p data-source-paragraph="15">Precisely within this sense of foreignness,  the memory carried me back to the archway from a few minutes ago. I had never been told the entire story of the world right in front of me, nor could I name every plant I saw, yet none of that prevented me from being drawn to it first. The same was true of the elegant patterns on the archway: I could not name every image depicted there. In particular, I could not even identify a single one of the plant motifs. Art had never explained this unfamiliar world to me, but before I could understand it, art had already made me willing to move closer to it.</p>
<p data-source-paragraph="16">Stepping onto a platform, I walk up to the bookshelf, and take down the dictionary. Indeed, I decided to seek out a definition of art in the most straightforward way possible. Opening the weighty dictionary, I stepped into a hall constructed from the accumulated wisdom of human civilization. Following the alphabetical order, I easily found “art”, yet fully understanding what it meant proved to be a challenge:</p>
<p data-source-paragraph="17"><br></p>
<p data-source-paragraph="18" class="essay-verse"><em>The imagination to express feelings,</em></p>
<p data-source-paragraph="19" class="essay-verse"><em>The object such as paintings.</em></p>
<p data-source-paragraph="20" class="essay-verse"><em>Everything we may learn from the schools,</em></p>
<p data-source-paragraph="21" class="essay-verse"><em>Not science, not that rigid,</em></p>
<p data-source-paragraph="22" class="essay-verse"><em>Everything that you appreciate,</em></p>
<p data-source-paragraph="23" class="essay-verse"><em>Not in words, not that properly defined.</em></p>
<p data-source-paragraph="24">I stared at each letter in the dictionary, urgently trying to find the answer they were conveying to me. Yet the combinations and arrangements of those letters did not converge upon a single focal point; instead, they revealed even more possibilities. Although I had not found the answer, I still found myself smiling slightly. Indeed, even the dictionary could not give “art” a precise definition.</p>
<p data-source-paragraph="25"><em>Why, then, am I still so obsessed with answering this question?</em></p>
<p data-source-paragraph="26">I closed the dictionary, my fingertips still resting on those few thin pages. Perhaps the answer had never been hidden within any single line of definition, nor had it been waiting for me to extract it from between the letters. Those moments I had once tried to categorize, judge, and prove had long been scattered across some corners of the past, waiting for me to look back at them again. Before the little boy first put the brush to paper, no one had ever told him where he should make his first mark. Encountering a language for the first time may not be about finding its precise definition, but rather about seeing, listening, and touching those things that we still cannot fully put into words.</p>
<p data-source-paragraph="27"><br></p>
<p data-source-paragraph="28">The figure from the past seemed to ask me, </p>
<p data-source-paragraph="29">“<em>w</em><em>hat are you looking for?</em>”</p>
<p data-source-paragraph="30">“<em>I am looking for … the truth of art?</em>”</p>
<p data-source-paragraph="31">“<em>And,</em> <em>have you found i</em><em>t?</em>”</p>
<p data-source-paragraph="32">“<em>Have I …</em>. <em>?</em>”</p>
<p data-source-paragraph="33">Space unfolded like a scroll. The young man stood still and turned to look behind him. The beginning of the scroll illuminated another direction, bright, but vague, <em>where there was an overlooked archway, lush Norfolk Island pines,</em><em> dense silver fern</em><em>, the call of a kiwi</em><em>,</em><em> a little cat turning away, a beach, three crayons, and a spotless white room</em>. Those were footprints left step by step along his journey. Each step was small, but together they formed a path that belonged to him alone. And ahead, where no footprints had yet been left… there still existed things the young man had never heard of or encountered before.</p>
<p data-source-paragraph="34">He had traveled far, not that far, yet he had painted a lot. The scroll ahead remained white. He still did not know where the next stroke would fall.</p>
</div>

<h1><strong>落笔之前</strong></h1>
<div class="essay-body" lang="zh-CN">
<p data-source-paragraph="1" class="essay-byline">启航</p>
<p data-source-paragraph="2">模糊轮廓的洁白房间里，各种颜色的蜡笔洒落在小男孩的身边。他坐在地上，左看看右看看，面对诸多色彩，他即将作出自己的选择。不一会儿，他的脑袋随着视线停在了蓝色的蜡笔上。他微微弯下身，捡起了蓝色蜡笔，他转过头盯着墙面。这是一面干净的墙面，好似一块专门为男孩准备的画布，不过他的妈妈绝对不会同意干净的墙面上充满不和谐的颜色。男孩似乎知道这一点，他并没有抓起一把蜡笔朝着墙面挥舞。小心翼翼地，他又择出了金色与绿色，三只蜡笔好似魔杖，在他面前展开了他印象中的海滩。</p>
<p data-source-paragraph="3" class="essay-special">“何为艺术？”</p>
<p data-source-paragraph="4">当然，小男孩并不知道答案，或者他知道一些，但是他的语言不足以支持他表达出对“艺术”的理解。一个连柏拉图与亚里士多德都曾反复追问的问题，刚牙牙学语的小男孩会有多少头绪呢？小男孩天然地相信大海就应该是蓝色的，树木就应该是绿色的。只要他将它们画在纸上，它们就存在了。仿佛这一切都是浑然天成的，在画笔之下，小男孩便是这一切的造物主。慢慢地，那白色的房间被添加上一缕缕颜色。</p>
<p data-source-paragraph="5">深蓝色、浅蓝色、金黄色与零星的绿色与棕色，小男孩看了看自己的杰作。突然，他想到了什么，于是快速起身，跑出了房间。随即，房间的轮廓与色彩开始渐渐模糊。</p>
<p data-source-paragraph="6">有人说：“艺术对我们而言像一门外语。对于第一次遇见它的人，它是陌生的，需要学习，需要靠近。”可如果艺术真的是一门需要学习的语言，那么那个连“艺术”是什么都不知道，却已经在画画的孩子，说的什么语言呢？</p>
<p data-source-paragraph="7">回忆是一场跨越时空的旅行，随着白色房间的离去，这场旅行暂停了。那是我记忆中第一次提笔作画，那三只蜡笔开启艺术空间的大门，我会经常怀揣着好奇在现实和艺术空间穿梭，那是独属于我的私人空间。收回所有思绪，我意识到我已坐在这幅作品前很久。没有太多人会注意到这幅作品的存在，亦或大家并没有把他当成一个作品：一个稍微具有年代感的历史复兴式半圆拱形结构连接着两个空间，支撑拱形结构的是两个与周围墙壁镶嵌在一起的厚重方柱。拱面有大量多彩绘饰，这些绘饰以深绿、金黄、砖红构造出各种动物、植物、以及几何纹样，栩栩如生，遥相呼应。昏暗的暖色灯光从正上方的仿煤油灯打下，照在泛黄的结构上，门中台阶上遍布的残缺诉说着它经历过的时光长河。隔着厚重的墙面，远处伯顿纪念钟塔的钟声隐约传来，<strong>学生们的脚步声则不断从拱门下穿</strong>过。每天都会有数以百计的人通过它，<strong>却鲜少有人会伫足欣赏结构那精美的刻画花纹与四周低饱和度的彩砖。</strong></p>
<p data-source-paragraph="8">它不是艺术。人们会略过一棵树、一个垃圾桶、一段毫不起眼且没有路灯的路，但是没有人会略过《蒙娜丽莎》。除非——他是已在画前数次驻足的老者；或是刚出生的孩童，没有读懂艺术这篇外语的能力。一个合理的推测是：人们会漠视丧失了新鲜感的事物，这些事物也不再是艺术。否定，艺术向来是双向的，这些事物本身的艺术性不会被人们定义，而是被“人”所定义。<strong>人是多样的，对事物的审美也是多样的；如果哪怕只有一个人感受到某件事物的艺术性，那么这件事物至少拥有一位欣赏者。</strong>现在，我可以肯定的是，被我观测并欣赏的结构体，哈彻图书馆的拱门，就是艺术。</p>
<p data-source-paragraph="9">如此轻易的给艺术下定义是不严谨的，在看似哲学的论证后，我忽视了那些反对的声音。如果艺术是一门语言，那么人们也许也有忘记阅读它的时候。</p>
<p data-source-paragraph="10">人的一生会通过很多扇门，而出门往往会和一段旅程联系在一起，也许是开启一段非凡的故事。眼前的拱门被工匠们精雕细琢后摆到了我面前。每一扇门对冒险家来说都好似饕餮面前的盛宴，因为他们会展现出无数的可能性。我似乎一直很喜欢门，不是因为门本身，而是我永远也不会推算出进入门后世界会发生什么，不过这正是吸引一位冒险家的诱因，更何况这扇门如此精美。现在，我要通过这个结构，跨入另一个空间。但是，我并不会马上进入下一段的时空旅行，原因很简单，上楼时不注意脚下并不是一个很好的策略。</p>
<p data-source-paragraph="11">我还是被一节稍微凸起的台阶绊到，思绪可不是我们可以随便操纵的东西。当一个人审美评价体系里真正的艺术涌入他的脑海时，他便会被这股强大的力量所卷走。</p>
<p data-source-paragraph="12">依然是一扇门，深棕色的亮漆搭配着鞋架上摆放着整整齐齐的鞋子，无不体现出这扇门内女主人整洁有序的风格。那扇门慢慢地关闭了，门内的小猫迈着慵懒的步伐向里屋走去，它并不会意识到门外的身影将会开启的旅程。是的，正如他的名字，他要启航了。</p>
<p data-source-paragraph="13">那是三道门，每扇门后都是不同的空间。那道身影接连跨出两道门，又进入一扇门，第一扇门分别留下了熟悉的房间、小猫与家人，另一扇留下了熟悉的语言、建筑与旗帜。而他进入的那扇门则是他以前从未踏足过的空间，那是一个被海洋环绕的国度。空间里的每一处细节都体现出一种异国风情：眼睛里不再见到社会主义的建筑，耳朵里不再听到熟悉的语言，旗杆上不再悬挂着熟悉的国旗。身后的门也渐渐远去，模糊。那道身影并没有踌躇太久，因为在崭新的门后，往往也有新的未知。</p>
<p data-source-paragraph="14">伴随着海鸥此起彼伏的高鸣，湿润的海风中携带着淡淡的盐沼味。清晨朦胧的雾气中，两棵扇形展开的翠绿南洋杉展现出高大笔挺的身姿，它们替代了另一扇门后层层帽檐重叠的深绿水杉。自然化身漆匠，将周遭事物染上了和谐的色调。那道刚跨出门的身影被眼前的景象所折服。俯身、侧耳，沾满露水的茂密银蕨中依稀传来几维鸟略带沙哑的喉音。伴随朝露洒落在小路上的滴答声，一场织于雾中的吟咏回荡在那道身影的耳边。阳光洒落在雾气中，使周围的一切朦胧，却很明亮，就如同最初的房间那般，只不过空间内已经不再那样洁白——那位小男孩，哦不，那位少年手中的笔却从来没有停过。</p>
<p data-source-paragraph="15">此时，那道身影似乎应该比任何时候都更能理解“陌生”是什么。周围的语言、建筑、植物，甚至空气里的气味都不再属于他所熟悉的世界。可奇怪的是，他并不需要谁去教他如何欣赏眼前的景象。那两棵南洋杉不需要翻译，清晨的雾气也不需要注解。他只是站在那里，看着它们。</p>
<p data-source-paragraph="16">正是在这种陌生之中，回忆将我带回方才的拱门。我并不了解眼前世界的来龙去脉，也叫不出每一种植物的名字，可这并不妨碍我先被它吸引。就如同拱门上的精美图纹，我无法叫出上面每一个图案的名称。特别是那些植物图纹，我甚至认不出其中的任何一种。艺术从未替我解释这个陌生的世界，却让我在完全理解它之前，先愿意靠近它。</p>
<p data-source-paragraph="17">登上了台阶，我来到了书架前，取下了字典。没错，我将用最直接的方法去寻找艺术的定义。翻开厚重的词典，我进入到了一个人类文明的智慧结晶所创造的殿堂。沿着字母表顺序，我轻松地找到了“艺术”一词，不过完全理解其含义却成为了一个挑战：</p>
<p data-source-paragraph="18" class="essay-verse"><em>寄情于想象，</em></p>
<p data-source-paragraph="19" class="essay-verse"><em>托形于丹青。</em></p>
<p data-source-paragraph="20" class="essay-verse"><em>吾之所习，</em></p>
<p data-source-paragraph="21" class="essay-verse"><em>非科学之属，亦未必严整。</em></p>
<p data-source-paragraph="22" class="essay-verse"><em>凡目之所悦、心之所赏，</em></p>
<p data-source-paragraph="23" class="essay-verse"><em>或无须言说，亦未有定名。</em></p>
<p data-source-paragraph="24">我盯着词典中的每一个字母，试图迫切寻出它们传递给我的那个答案。然而字母间的排列组合并没有汇聚到一处焦点，相反，它们展现出的则是更多的可能性。虽然没有寻得答案，我的嘴角却依旧微微上扬。是啊，就连词典也不能给“艺术”一个确切的定义。</p>
<p data-source-paragraph="25" class="essay-special"><strong>我，为什么还要执着于寻求这个问题的答案呢？</strong></p>
<p data-source-paragraph="26">合上词典，我的指尖仍停留在那几页薄薄的纸张上。也许答案从来没有藏在某一行定义里，也没有等待着被我从字母之间提取出来。那些我曾试图归类、判断、证明的瞬间，早已散落在过去的某个角落，等着我重新回望。小男孩第一次提笔前，从来没有人告诉他应在哪里落笔。初次接触一门语言，也许并不是找到它准确的定义，而是去看、去听、去触碰那些我们暂时还无法完全说清的东西。</p>
<p data-source-paragraph="27">记忆中的那道身影问道：“你在寻找什么？”</p>
<p data-source-paragraph="28">“我在寻找艺术的...真谛？”</p>
<p data-source-paragraph="29">“那你找到了吗？”</p>
<p data-source-paragraph="30">“我......找到了吗？”</p>
<p data-source-paragraph="31">空间犹如画卷被铺开，青年站在原地，转身看向身后，卷轴的起点照亮着另一个方向，那里有着无人问津的拱门、葱郁的南洋杉、转身离去的小猫、海滩、三只蜡笔，以及，一个洁白无暇的房间。那是他的旅程所踏出的一步步脚印，每一步都不大，连起来却构成了一条独属于他的道路。而在没有脚印的前方......依旧存在着青年闻所未闻之物。</p>
<p data-source-paragraph="32">他走了很远，也画了很多。卷轴前方依旧洁白，他仍不知道下一笔将会落在何处。</p>
</div>

<template data-essay-language="ja" data-essay-lang="ja">
<h1>次のひと筆の前に</h1>
<div class="essay-body" lang="ja">
<p class="essay-byline">啓航</p>
<p data-source-paragraph="1">輪郭のぼやけた白い部屋で、色とりどりのクレヨンが小さな男の子のまわりに散らばっていた。床に座り、右を見たり左を見たりしながら、たくさんの色を前に、自分で一つを選ぼうとしていた。やがて、その視線が青いクレヨンの上で止まった。少しかがんでそれを拾い、顔を向けて壁を見つめる。きれいな壁だった。まるで男の子のために用意された画布のようだったが、母親なら、そのきれいな壁をちぐはぐな色で埋めることには、きっと賛成しなかっただろう。男の子もそれを知っていたのか、クレヨンをひとつかみして壁に振り回すようなことはしなかった。慎重に、金色と緑も選び出す。三本のクレヨンは魔法の杖のように、記憶の中の海辺を目の前に広げていった。</p>
<p data-source-paragraph="2">「芸術とは何か」</p>
<p data-source-paragraph="3">もちろん、小さな男の子に答えはわからなかった。あるいは、何かはわかっていたのかもしれない。ただ、あまりにも幼く、「芸術」についての自分なりの理解を言葉にするすべを、まだ持っていなかった。プラトンやアリストテレスでさえ繰り返し向き合った問いに、ようやく話し始めたばかりの男の子が、いったいどれほどの手がかりを持てただろう。男の子は、ごく自然に、海は青く、木は緑であるはずだと信じていた。紙に描きさえすれば、それらはそこに存在した。すべてがひとりでにそうなるかのようで、画筆の下では、男の子がそのすべての創造主だった。白い部屋に、少しずつ色の筋が加わっていった。</p>
<p data-source-paragraph="4">藍色、空色、黄金色、ところどころに緑と茶色。男の子は自分の傑作を眺めた。ふと何かを思いつくと、さっと立ち上がり、部屋から駆け出していった。その直後、部屋の輪郭も色も、ゆっくりとぼやけ始めた。</p>
<p data-source-paragraph="5">ある人は、芸術は私たちにとって外国語のようなものだと言った。初めて出会う者にはなじみがなく、学ぶことも、近づくことも必要なのだと。けれど、芸術が本当に学ばなければならない言語なのだとしたら、「芸術」が何かも知らないまま、すでに絵を描いていたあの子は、何語を話していたのだろう。</p>
<p data-source-paragraph="6">記憶とは時空を越える旅であり、白い部屋が遠のくと、その旅はいったん止まった。あれは、私の覚えているかぎり、初めて絵を描く道具を手にしたときだった。あの三本のクレヨンが芸術の空間への扉を開いた。それから私は、好奇心を抱いて、現実とその空間のあいだをたびたび行き来するようになった。私だけの、ひそかな空間だった。思いをすべて引き戻すと、この作品の前にずいぶん長く座っていたことに気づいた。この作品の存在に目を留める人は多くない。あるいは、そもそも作品だとは思われていないのかもしれない。少し時を経た歴史主義的な様式の半円アーチが、二つの空間をつないでいた。まわりの壁に組み込まれた、重厚な二本の角柱がそれを支えている。アーチの表面には多彩な装飾が施され、深い緑、黄金色、煉瓦色が、動物や植物、幾何学の文様を生き生きと描き出し、互いに呼応していた。真上の灯油ランプを模した照明から、薄暗い暖かな光が黄ばんだ構造物に降り注ぎ、アーチの下の欠けや摩耗の跡は、それがくぐり抜けてきた長い歳月を語っていた。厚い壁を隔てて、遠くのバートン記念塔の鐘の音がかすかに聞こえ、学生たちの足音は絶えずアーチの下を通り過ぎていく。毎日、何百人もの人がここを通る。それでも、精緻な装飾文様や、そのまわりの落ち着いた色のタイルを、立ち止まって眺める人はほとんどいない。</p>
<p data-source-paragraph="7">これは芸術ではない。人は一本の木や、ごみ箱や、街灯さえない目立たぬ道を見過ごす。しかし、《モナ・リザ》を見過ごす人はいない。もし、いるとすれば……すでに何度もその絵の前に立った老人か、芸術という外国語を読み解く力をまだ持たない、生まれたばかりの子どもだろう。こんな推測なら、もっともらしい。人は新鮮さを失ったものに目を向けなくなり、そうしたものはもはや芸術ではなくなる。いや、芸術はもともと双方向のものだ。ものの芸術性を定めるのは「人々」ではなく、一人ひとりの「人」なのだ。人は多様であり、ものに対する美的判断もまた多様だ。たとえ一人でも、あるものに芸術性を感じるなら、それには少なくとも一人の鑑賞者がいる。今、私が確かに言えるのは、私が観察し、味わったこの構造物――ハッチャー図書館のアーチは、芸術だということだ。</p>
<p data-source-paragraph="8">こんなふうに数式めかして芸術を定義するのは、あまりに硬直している。いかにも哲学的に見える議論のあとで、私は異を唱える声を置き去りにしていた。芸術が言語なのだとすれば、人はその読み方を忘れることもあるのかもしれない。</p>
<p data-source-paragraph="9">人は一生のうちに、いくつもの扉をくぐる。そして扉の外へ出ることは、しばしば一つの旅と結びついている。そこから、非凡な物語が始まるのかもしれない。目の前のアーチは、職人たちの手で丹念に造られ、飾られたものだった。冒険家にとっての扉は、食いしん坊の前に並ぶごちそうにも似ている。その一つひとつが、謎めいた空間に潜む無数の可能性を見せてくれるからだ。私はどうやら、ずっと扉が好きだった。扉そのもののためではない。その向こうの世界で何が起こるか、決して予測できないからだ。けれど、その不確かさこそが冒険家を誘う。まして、その扉自体がこれほど美しいのなら。今、私はこの構造物をくぐり、別の空間へ踏み入ろうとしている。ただし、すぐに次の時空の旅へ向かうわけではない。理由は単純だ。階段を上るとき、足元を見ないのは、あまりよい作戦とは言えない。</p>
<p data-source-paragraph="10">それでも、私はつまずいた。思考は、思うままに操れるものではない。自分の美的判断の体系に本当に属する芸術が心へと流れ込んできたとき、人はその強い力にさらわれてしまう。</p>
<p data-source-paragraph="11">そこにもまた、扉があった。光沢のある焦げ茶色の塗装も、靴棚にきちんと並べられた靴も、その奥に暮らす女性の整然としたあり方を映していた。扉はゆっくりと閉まった。内側にいた小さな猫は、気だるげな足取りで奥の部屋へ向かい、扉の外の人影がこれから始める旅には気づきもしなかった。そう、名前のとおり、彼はまさに「啓航」――帆を上げ、旅立とうとしていた。</p>
<p data-source-paragraph="12">三つの扉があり、その一つひとつが異なる空間へと開いていた。あの人影は、続けざまに二つの扉を出た。最初の扉の向こうには、なじみの部屋と、小さな猫と、家族が残り、二つ目の向こうには、なじみの言葉と建物と旗が残った。それから彼は、もう一つの扉を入った。その先には、それまで一度も足を踏み入れたことのない空間があった。海に囲まれた国だった。細部のすべてが、異国の気配を帯びていた。目にはもはや社会主義の建築が映らず、耳にはなじみの言葉が届かず、旗竿には見慣れた国旗が掛かっていない。背後の扉はしだいに遠のき、ぼやけていった。人影は長くためらわなかった。新しい扉の向こうには、たいてい新しい何かがあるからだ。</p>
<p data-source-paragraph="13">高く低く響くカモメの声のあいだを、湿った潮風が、塩性湿地のかすかな匂いを運んでいた。朝の淡い霧の中、二本のノーフォークマツが高くまっすぐに立ち、重なり合う枝葉を、扉の向こうに広げていた。自然は画家となり、まわりのすべてを調和した色に塗っていた。扉を出たばかりの人影は、眼前の景色に心を奪われた。身をかがめ、耳を澄ますと、露をまとった銀シダの茂みから、キーウィの少しかすれた声がかすかに聞こえる。朝露が小道に落ちる柔らかな音に寄り添って、霧に織り込まれた詠唱が、人影のまわりに響いていた。霧を透かした陽の光が、すべてをぼんやりと、それでも明るく照らしていた。ちょうど、最初の部屋のように。ただ、その空間はもう、あれほど白くはなかった。小さな男の子――いや、少年の手の中で、画筆は一度も動きを止めていなかった。</p>
<p data-source-paragraph="14">その瞬間、人影は「なじみのなさ」というものを、それまでのいつよりもよくわかったように思えた。言葉も、建物も、植物も、空気の匂いさえ、もはや自分の知っている世界のものではない。それなのに不思議なことに、眼前の景色をどう味わうのか、誰かに教わる必要はなかった。二本のノーフォークマツに翻訳はいらず、朝霧に注釈もいらなかった。ただ、そこに立ち、それらを見ていた。</p>
<p data-source-paragraph="15">まさにそのなじみのなさの中で、記憶が私を数分前のアーチへと連れ戻した。眼前の世界のいきさつをすべて教わったわけではなく、目にする植物の名を一つ残らず言えるわけでもなかった。それでも、まず惹かれることを、何も妨げはしなかった。アーチの優美な文様も同じだった。そこに描かれたものを、すべて名指すことはできない。とりわけ植物の文様は、一つとして何の植物かわからなかった。芸術は、この見知らぬ世界を私に説明してくれたことはない。けれど、私が理解する前に、すでにそこへ近づきたいと思わせていた。</p>
<p data-source-paragraph="16">踊り場に上がり、私は本棚へ歩いていって、辞書を取り出す。そう、できるかぎり直接的な方法で、芸術の定義を探すことにしたのだ。ずっしりとした辞書を開くと、人類の文明が積み重ねてきた知恵で築かれた殿堂へと踏み入った。アルファベット順をたどれば、「art」はすぐに見つかった。しかし、その意味を十分に理解するとなると、難しかった。</p>
<p data-source-paragraph="17" class="essay-break" aria-hidden="true"></p>
<p data-source-paragraph="18" class="essay-verse"><em>想像によって、思いを表すこと、</em></p>
<p data-source-paragraph="19" class="essay-verse"><em>絵画のように、形あるもの。</em></p>
<p data-source-paragraph="20" class="essay-verse"><em>学校で私たちが学びうる、あらゆること、</em></p>
<p data-source-paragraph="21" class="essay-verse"><em>科学ではなく、それほど厳密でもなく、</em></p>
<p data-source-paragraph="22" class="essay-verse"><em>あなたがよいと感じる、あらゆるもの、</em></p>
<p data-source-paragraph="23" class="essay-verse"><em>言葉によらず、それほど明確にも定められず。</em></p>
<p data-source-paragraph="24">辞書の文字を一つひとつ見つめ、それらが私に伝えようとしている答えを、しきりに探した。けれど、文字の組み合わせや並びは、一つの焦点へと集まることなく、むしろ、さらに多くの可能性を示していた。答えは見つからなかったが、それでも口元にはかすかな笑みが浮かんだ。そう、辞書でさえ、「芸術」に正確な定義を与えることはできないのだ。</p>
<p data-source-paragraph="25"><em>それなら、なぜ私は、まだこの問いに答えることにこだわっているのだろう。</em></p>
<p data-source-paragraph="26">辞書を閉じても、指先はまだ、あの数枚の薄い紙に触れていた。答えは、そもそもどこか一行の定義に隠れていたわけでも、文字のあいだから私に取り出されるのを待っていたわけでもないのかもしれない。かつて分類し、判断し、証明しようとした瞬間は、とっくに過去のいくつかの片隅へ散らばり、私がもう一度振り返るのを待っていた。あの男の子が初めて画筆を紙に置く前、最初のひと筆をどこに置くべきか、誰も教えてはいなかった。ある言語に初めて出会うとは、その正確な定義を見つけることではなく、まだ十分に言葉にできないものを、見て、聞いて、触れてみることなのかもしれない。</p>
<p data-source-paragraph="27" class="essay-break" aria-hidden="true"></p>
<p data-source-paragraph="28">記憶の中の人影が、私に問いかけるようだった。</p>
<p data-source-paragraph="29">「<em>何を探しているの？</em>」</p>
<p data-source-paragraph="30">「<em>探しているのは……芸術の真実、なのかな？</em>」</p>
<p data-source-paragraph="31">「<em>それで、見つかった？</em>」</p>
<p data-source-paragraph="32">「<em>私は……見つけたのだろうか？</em>」</p>
<p data-source-paragraph="33">空間が、絵巻のように広がった。青年は立ち止まり、後ろを振り返った。巻物の始まりが、もう一つの方向を照らしていた。明るく、それでいてぼんやりとしたその先には、<em>見過ごされていたアーチがあり、緑豊かなノーフォークマツがあり、茂った銀シダがあり、キーウィの声があり、背を向ける小さな猫があり、海辺があり、三本のクレヨンと、汚れ一つない白い部屋があった</em>。それらは、彼が旅の途中で一歩ずつ残してきた足跡だった。一歩一歩は小さくても、つなげれば、彼だけの道になった。そして、まだ足跡のない前方には……青年が聞いたことも、出会ったこともないものが、なお存在していた。</p>
<p data-source-paragraph="34">遠くまで来た。それほど遠くでもなかった。それでも、たくさん描いてきた。巻物の先は、まだ白い。次のひと筆がどこに置かれるのか、彼にはまだわからなかった。</p>
</div>

<template data-essay-language="fr" data-essay-lang="fr">
<h1>Avant le prochain trait</h1>
<div class="essay-body" lang="fr">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="1">Dans une pièce blanche aux contours flous, des crayons de cire de toutes les couleurs étaient éparpillés autour d’un petit garçon. Assis par terre, il regardait à droite et à gauche ; devant tant de couleurs, il s’apprêtait à faire son propre choix. Bientôt, son regard s’arrêta sur le crayon bleu. Il se pencha légèrement pour le ramasser, puis tourna la tête et fixa le mur. C’était un mur propre, comme une toile préparée tout exprès pour lui, même si sa mère n’aurait certainement pas accepté de le voir couvert de couleurs discordantes. Le garçon semblait le savoir : il ne saisit pas une poignée de crayons pour les agiter sur le mur. Avec précaution, il choisit aussi le doré et le vert, et les trois crayons, telles des baguettes magiques, déployèrent devant lui la plage telle qu’il la gardait en mémoire.</p>
<p data-source-paragraph="2">« Qu’est-ce que l’art ? »</p>
<p data-source-paragraph="3">Bien sûr, le petit garçon ne connaissait pas la réponse. Ou peut-être savait-il quelque chose, mais il était trop jeune et ne disposait pas encore des mots pour exprimer sa compréhension de l’« art ». Face à une question que Platon et Aristote eux-mêmes n’avaient cessé de reprendre, de quels indices un petit garçon qui commençait tout juste à parler pouvait-il bien disposer ? Il croyait d’instinct que la mer devait être bleue et les arbres verts. Il lui suffisait de les dessiner sur du papier pour qu’ils existent. Tout cela semblait aller de soi, et sous son pinceau, le petit garçon devenait le créateur de toutes ces choses. Peu à peu, des traînées de couleur vinrent s’ajouter à la pièce blanche.</p>
<p data-source-paragraph="4">Bleu indigo, bleu azur, jaune doré, quelques touches de vert et de brun : le petit garçon contempla son chef-d’œuvre. Soudain, quelque chose lui vint à l’esprit ; il se leva aussitôt et sortit de la pièce en courant. À peine était-il parti que les contours et les couleurs de la pièce commencèrent à se brouiller.</p>
<p data-source-paragraph="5">Quelqu’un a dit que l’art était pour nous comme une langue étrangère. À qui le rencontre pour la première fois, il est inconnu ; il faut l’apprendre, il faut s’en approcher. Mais si l’art est vraiment une langue qu’il faut apprendre, quelle langue parlait cet enfant qui ne savait même pas ce qu’était l’« art » et qui, pourtant, dessinait déjà ?</p>
<p data-source-paragraph="6">La mémoire est un voyage à travers le temps et l’espace ; lorsque la pièce blanche s’effaça, le voyage s’interrompit. C’était la première fois, dans mon souvenir, que je prenais un instrument pour dessiner. Ces trois crayons m’avaient ouvert la porte du domaine de l’art ; souvent, poussé par la curiosité, j’allais et venais entre la réalité et cet espace artistique, un espace intime qui n’appartenait qu’à moi. Rassemblant mes pensées, je me rendis compte que j’étais assis depuis longtemps devant cette œuvre. Peu de gens remarquaient son existence, à moins qu’ils ne la considèrent tout simplement pas comme une œuvre : une arcade en plein cintre, de style historiciste et légèrement marquée par le temps, reliait deux espaces. Elle reposait sur deux piliers carrés et massifs engagés dans les murs alentour. Sa surface était couverte d’ornements polychromes où le vert profond, le jaune doré et le rouge brique composaient des motifs d’animaux, de plantes et de figures géométriques, vivants et se répondant les uns aux autres. Juste au-dessus, une imitation de lampe à pétrole diffusait une faible lumière chaude sur la structure jaunie, tandis que les éclats et les marques d’usure sous l’arcade racontaient les longues années qu’elle avait traversées. À travers les murs épais parvenait, à peine perceptible, le carillon lointain de la tour commémorative Burton, tandis que les pas des étudiants continuaient de résonner sous l’arcade. Des centaines de personnes y passent chaque jour, mais rares sont celles qui s’arrêtent pour admirer la finesse de ses motifs décoratifs et les carreaux aux couleurs assourdies qui l’entourent.</p>
<p data-source-paragraph="7">Ce n’est pas de l’art. On peut passer sans les voir devant un arbre, une poubelle, un bout de chemin quelconque dépourvu même de réverbère ; mais personne ne passe sans voir la Joconde. À moins… d’être un vieil homme qui s’est déjà arrêté maintes fois devant le tableau ; ou un nouveau-né, incapable de lire cette langue étrangère qu’est l’art. Voici une conjecture raisonnable : les gens ne prêtent plus attention aux choses qui ont perdu leur nouveauté, et ces choses ne sont plus de l’art. Non, l’art a toujours été une relation à double sens ; la qualité artistique de ces choses n’est pas définie par « les gens », mais par chaque « personne ». Les personnes sont diverses, et leurs jugements esthétiques le sont aussi ; si une seule personne perçoit une dimension artistique dans une chose, cette chose possède au moins un admirateur. À présent, ce que je peux affirmer avec certitude, c’est que la structure que j’ai observée et appréciée — l’arcade de la bibliothèque Hatcher — est de l’art.</p>
<p data-source-paragraph="8">Définir l’art de manière aussi mathématique est trop rigide ; après cette argumentation d’apparence philosophique, j’avais négligé les voix contraires. Si l’art est une langue, peut-être arrive-t-il aussi que l’on oublie comment la lire.</p>
<p data-source-paragraph="9">Au cours d’une vie, on franchit bien des portes, et sortir par une porte est souvent associé à un voyage, peut-être au commencement d’une histoire extraordinaire. L’arcade devant moi avait été soigneusement façonnée et ornée par des artisans. Pour un aventurier, chaque porte est comme un festin dressé devant un gourmand : chacune révèle d’innombrables possibles dans les espaces mystérieux qu’elle ouvre. Il me semble avoir toujours aimé les portes, non pour elles-mêmes, mais parce que je ne peux jamais prévoir ce qui arrivera dans le monde qui se trouve derrière. Or cette incertitude est précisément ce qui attire un aventurier — surtout lorsque la porte elle-même est si belle. Je vais maintenant franchir cette structure et pénétrer dans un autre espace. Mais je ne me lancerai pas tout de suite dans un nouveau voyage à travers le temps et l’espace, pour une raison simple : ne pas regarder où l’on met les pieds en montant un escalier n’est pas une très bonne stratégie.</p>
<p data-source-paragraph="10">J’ai tout de même trébuché, car la pensée n’est pas une chose que l’on puisse diriger à volonté. Quand l’art qui trouve véritablement sa place dans notre système de jugement esthétique nous envahit l’esprit, sa force nous emporte.</p>
<p data-source-paragraph="11">C’était encore une porte : sa peinture brun foncé, brillante, et les chaussures soigneusement alignées sur le meuble reflétaient toutes l’ordre et la propreté de la femme qui vivait derrière. La porte se referma lentement et le petit chat à l’intérieur se dirigea d’un pas paresseux vers le fond de l’appartement, sans rien savoir du voyage qu’allait entreprendre la silhouette restée dehors. Oui, comme le disait son prénom, il allait Qihang : mettre les voiles, commencer le voyage.</p>
<p data-source-paragraph="12">Il y avait trois portes, chacune ouvrant sur un espace différent. La silhouette sortit successivement par deux d’entre elles. Derrière la première restaient la pièce familière, le petit chat et la famille ; derrière la seconde, la langue, les bâtiments et les drapeaux familiers. Puis elle entra par une autre porte. Celle-ci menait à un espace où elle n’avait jamais mis les pieds, un pays entouré par l’océan, où chaque détail portait la marque de l’ailleurs : ses yeux ne voyaient plus d’architecture socialiste, ses oreilles n’entendaient plus de langue familière, et les mâts ne portaient plus les drapeaux connus. Derrière elle, la porte s’éloignait et se brouillait peu à peu. La silhouette n’hésita pas longtemps, car au-delà d’une porte toute neuve, il y avait souvent quelque chose de nouveau.</p>
<p data-source-paragraph="13">Parmi les cris des mouettes qui montaient et retombaient, la brise marine, humide, apportait une légère odeur de marais salé. Dans la brume incertaine du petit matin, deux grands pins de Norfolk se dressaient bien droits de l’autre côté de la porte, déployant leurs couronnes en étages superposés. La nature se faisait peintre et revêtait tout alentour de teintes harmonieuses. La silhouette qui venait de franchir la porte fut captivée par le spectacle. En se penchant et en prêtant l’oreille, elle distinguait, parmi les fougères argentées touffues et perlées de rosée, l’appel un peu rauque d’un kiwi. Accompagnée du doux bruit de la rosée matinale tombant sur le chemin, une psalmodie tissée dans la brume résonnait autour d’elle. Le soleil filtrait à travers le brouillard, rendant tout à la fois vague et lumineux, comme dans la pièce du début — à ceci près que l’espace n’était plus aussi blanc. Le petit garçon, non, l’adolescent, n’avait jamais cessé de faire courir le pinceau dans sa main.</p>
<p data-source-paragraph="14">À cet instant, la silhouette semblait comprendre mieux que jamais ce qu’était l’« étrangeté ». La langue, les bâtiments, les plantes, même l’odeur de l’air ne faisaient plus partie du monde qu’elle connaissait. Et pourtant, étrangement, elle n’avait besoin de personne pour lui apprendre à apprécier le paysage devant elle. Les deux pins de Norfolk n’avaient pas besoin de traduction, ni la brume du matin d’annotation. Elle se tenait simplement là et les regardait.</p>
<p data-source-paragraph="15">C’est précisément au cœur de cette étrangeté que le souvenir me ramena à l’arcade de quelques minutes auparavant. On ne m’avait jamais raconté toute l’histoire du monde qui se tenait devant moi, et je ne pouvais pas nommer chacune des plantes que je voyais ; rien de tout cela ne m’empêchait pourtant de me sentir d’abord attiré par lui. Il en allait de même des élégants motifs de l’arcade : je ne pouvais pas nommer chaque figure qui y était représentée. En particulier, je n’étais capable d’identifier aucun des motifs végétaux. L’art ne m’avait jamais expliqué ce monde inconnu, mais avant même que je puisse le comprendre, il m’avait déjà donné envie de m’en approcher.</p>
<p data-source-paragraph="16">J’arrive sur un palier, m’avance vers l’étagère et en retire le dictionnaire. Oui, j’ai décidé de chercher une définition de l’art de la manière la plus directe possible. En ouvrant le lourd dictionnaire, j’entre dans une salle édifiée par la sagesse accumulée de la civilisation humaine. En suivant l’ordre alphabétique, je trouve sans peine le mot « art » ; en saisir pleinement le sens s’avère pourtant difficile :</p>
<p data-source-paragraph="17" class="essay-break" aria-hidden="true"></p>
<p data-source-paragraph="18" class="essay-verse"><em>L’imagination pour exprimer les sentiments,</em></p>
<p data-source-paragraph="19" class="essay-verse"><em>L’objet, tel un tableau.</em></p>
<p data-source-paragraph="20" class="essay-verse"><em>Tout ce que nous pouvons apprendre à l’école,</em></p>
<p data-source-paragraph="21" class="essay-verse"><em>Pas la science, pas autant de rigueur,</em></p>
<p data-source-paragraph="22" class="essay-verse"><em>Tout ce que vous appréciez,</em></p>
<p data-source-paragraph="23" class="essay-verse"><em>Pas dans les mots, pas si nettement défini.</em></p>
<p data-source-paragraph="24">Je fixais chaque lettre du dictionnaire, cherchant avec impatience la réponse qu’elles me transmettaient. Pourtant, leurs combinaisons et leurs agencements ne convergeaient pas vers un point unique ; ils révélaient au contraire davantage de possibles. Je n’avais pas trouvé la réponse, mais un léger sourire me venait tout de même aux lèvres. Oui, même le dictionnaire ne pouvait donner de l’« art » une définition précise.</p>
<p data-source-paragraph="25"><em>Pourquoi, alors, est-ce que je tiens encore tant à répondre à cette question ?</em></p>
<p data-source-paragraph="26">Je refermai le dictionnaire, le bout des doigts posé encore sur ces quelques feuilles minces. Peut-être la réponse n’avait-elle jamais été cachée dans une ligne de définition, ni attendu que je l’extraie d’entre les lettres. Ces instants que j’avais autrefois tenté de classer, de juger et de prouver étaient depuis longtemps dispersés dans quelques recoins du passé, attendant que je les regarde à nouveau. Avant que le petit garçon ne pose pour la première fois son pinceau sur le papier, personne ne lui avait jamais dit où tracer son premier trait. Rencontrer une langue pour la première fois ne consiste peut-être pas à en trouver la définition exacte, mais à voir, à écouter, à toucher ces choses que nous ne savons pas encore tout à fait mettre en mots.</p>
<p data-source-paragraph="27" class="essay-break" aria-hidden="true"></p>
<p data-source-paragraph="28">La silhouette du passé semblait me demander :</p>
<p data-source-paragraph="29">« <em>Que cherches-tu ?</em> »</p>
<p data-source-paragraph="30">« <em>Je cherche… la vérité de l’art ?</em> »</p>
<p data-source-paragraph="31">« <em>Et l’as-tu trouvée ?</em> »</p>
<p data-source-paragraph="32">« <em>Est-ce que je l’ai… trouvée ?</em> »</p>
<p data-source-paragraph="33">L’espace se déploya comme un rouleau peint. Le jeune homme s’immobilisa et se retourna. Le début du rouleau éclairait une autre direction, lumineuse mais vague, <em>où se trouvaient une arcade négligée, des pins de Norfolk luxuriants, d’épaisses fougères argentées, l’appel d’un kiwi, un petit chat qui se détournait, une plage, trois crayons et une pièce blanche, immaculée</em>. C’étaient les empreintes qu’il avait laissées pas à pas au fil de son voyage. Chaque pas était petit, mais tous ensemble formaient un chemin qui n’appartenait qu’à lui. Et devant, là où aucune empreinte n’avait encore été laissée… il existait toujours des choses dont le jeune homme n’avait jamais entendu parler, qu’il n’avait jamais rencontrées.</p>
<p data-source-paragraph="34">Il avait voyagé loin, pas si loin, et pourtant il avait beaucoup peint. Devant lui, le rouleau restait blanc. Il ne savait toujours pas où se poserait le prochain trait.</p>
</div>

<template data-essay-language="zh-Hant" data-essay-lang="zh-Hant">
<h1><strong>落筆之前</strong></h1>
<div class="essay-body" lang="zh-Hant">
<p data-source-paragraph="1" class="essay-byline">啟航</p>
<p data-source-paragraph="2">模糊輪廓的潔白房間里，各種顏色的蠟筆灑落在小男孩的身邊。他坐在地上，左看看右看看，面對諸多色彩，他即將作出自己的選擇。不一會兒，他的腦袋隨著視線停在了藍色的蠟筆上。他微微彎下身，撿起了藍色蠟筆，他轉過頭盯著牆面。這是一面乾淨的牆面，好似一塊專門為男孩準備的畫布，不過他的媽媽絕對不會同意乾淨的牆面上充滿不和諧的顏色。男孩似乎知道這一點，他並沒有抓起一把蠟筆朝著牆面揮舞。小心翼翼地，他又擇出了金色與綠色，三隻蠟筆好似魔杖，在他面前展開了他印象中的海灘。</p>
<p data-source-paragraph="3" class="essay-special">“何為藝術？”</p>
<p data-source-paragraph="4">當然，小男孩並不知道答案，或者他知道一些，但是他的語言不足以支持他表達出對“藝術”的理解。一個連柏拉圖與亞里士多德都曾反復追問的問題，剛牙牙學語的小男孩會有多少頭緒呢？小男孩天然地相信大海就應該是藍色的，樹木就應該是綠色的。只要他將它們畫在紙上，它們就存在了。彷彿這一切都是渾然天成的，在畫筆之下，小男孩便是這一切的造物主。慢慢地，那白色的房間被添加上一縷縷顏色。</p>
<p data-source-paragraph="5">深藍色、淺藍色、金黃色與零星的綠色與棕色，小男孩看了看自己的傑作。突然，他想到了什麼，於是快速起身，跑出了房間。隨即，房間的輪廓與色彩開始漸漸模糊。</p>
<p data-source-paragraph="6">有人說：“藝術對我們而言像一門外語。對於第一次遇見它的人，它是陌生的，需要學習，需要靠近。”可如果藝術真的是一門需要學習的語言，那麼那個連“藝術”是什麼都不知道，卻已經在畫畫的孩子，說的什麼語言呢？</p>
<p data-source-paragraph="7">回憶是一場跨越時空的旅行，隨著白色房間的離去，這場旅行暫停了。那是我記憶中第一次提筆作畫，那三隻蠟筆開啟藝術空間的大門，我會經常懷揣著好奇在現實和藝術空間穿梭，那是獨屬於我的私人空間。收回所有思緒，我意識到我已坐在這幅作品前很久。沒有太多人會注意到這幅作品的存在，亦或大家並沒有把他當成一個作品：一個稍微具有年代感的歷史復興式半圓拱形結構連接著兩個空間，支撐拱形結構的是兩個與周圍牆壁鑲嵌在一起的厚重方柱。拱面有大量多彩繪飾，這些繪飾以深綠、金黃、磚紅構造出各種動物、植物、以及幾何紋樣，栩栩如生，遙相呼應。昏暗的暖色燈光從正上方的仿煤油燈打下，照在泛黃的結構上，門中台階上遍布的殘缺訴說著它經歷過的時光長河。隔著厚重的牆面，遠處伯頓紀念鐘塔的鐘聲隱約傳來，<strong>學生們的腳步聲則不斷從拱門下穿</strong>過。每天都會有數以百計的人通過它，<strong>卻鮮少有人會佇足欣賞結構那精美的刻畫花紋與四周低飽和度的彩磚。</strong></p>
<p data-source-paragraph="8">它不是藝術。人們會略過一棵樹、一個垃圾桶、一段毫不起眼且沒有路燈的路，但是沒有人會略過《蒙娜麗莎》。除非——他是已在畫前數次駐足的老者；或是剛出生的孩童，沒有讀懂藝術這篇外語的能力。一個合理的推測是：人們會漠視喪失了新鮮感的事物，這些事物也不再是藝術。否定，藝術向來是雙向的，這些事物本身的藝術性不會被人們定義，而是被“人”所定義。<strong>人是多樣的，對事物的審美也是多樣的；如果哪怕只有一個人感受到某件事物的藝術性，那麼這件事物至少擁有一位欣賞者。</strong>現在，我可以肯定的是，被我觀測並欣賞的結構體，哈徹圖書館的拱門，就是藝術。</p>
<p data-source-paragraph="9">如此輕易的給藝術下定義是不嚴謹的，在看似哲學的論證後，我忽視了那些反對的聲音。如果藝術是一門語言，那麼人們也許也有忘記閱讀它的時候。</p>
<p data-source-paragraph="10">人的一生會通過很多扇門，而出門往往會和一段旅程聯繫在一起，也許是開啟一段非凡的故事。眼前的拱門被工匠們精雕細琢後擺到了我面前。每一扇門對冒險家來說都好似饕餮面前的盛宴，因為他們會展現出無數的可能性。我似乎一直很喜歡門，不是因為門本身，而是我永遠也不會推算出進入門後世界會發生什麼，不過這正是吸引一位冒險家的誘因，更何況這扇門如此精美。現在，我要通過這個結構，跨入另一個空間。但是，我並不會馬上進入下一段的時空旅行，原因很簡單，上樓時不注意腳下並不是一個很好的策略。</p>
<p data-source-paragraph="11">我還是被一節稍微凸起的台階絆到，思緒可不是我們可以隨便操縱的東西。當一個人審美評價體系里真正的藝術湧入他的腦海時，他便會被這股強大的力量所捲走。</p>
<p data-source-paragraph="12">依然是一扇門，深棕色的亮漆搭配著鞋架上擺放著整整齊齊的鞋子，無不體現出這扇門內女主人整潔有序的風格。那扇門慢慢地關閉了，門內的小貓邁著慵懶的步伐向裡屋走去，它並不會意識到門外的身影將會開啟的旅程。是的，正如他的名字，他要啟航了。</p>
<p data-source-paragraph="13">那是三道門，每扇門後都是不同的空間。那道身影接連跨出兩道門，又進入一扇門，第一扇門分別留下了熟悉的房間、小貓與家人，另一扇留下了熟悉的語言、建築與旗幟。而他進入的那扇門則是他以前從未踏足過的空間，那是一個被海洋環繞的國度。空間里的每一處細節都體現出一種異國風情：眼睛里不再見到社會主義的建築，耳朵里不再聽到熟悉的語言，旗桿上不再懸掛著熟悉的國旗。身後的門也漸漸遠去，模糊。那道身影並沒有躊躇太久，因為在嶄新的門後，往往也有新的未知。</p>
<p data-source-paragraph="14">伴隨著海鷗此起彼伏的高鳴，濕潤的海風中攜帶著淡淡的鹽沼味。清晨朦朧的霧氣中，兩棵扇形展開的翠綠南洋杉展現出高大筆挺的身姿，它們替代了另一扇門後層層帽檐重疊的深綠水杉。自然化身漆匠，將周遭事物染上了和諧的色調。那道剛跨出門的身影被眼前的景象所折服。俯身、側耳，沾滿露水的茂密銀蕨中依稀傳來幾維鳥略帶沙啞的喉音。伴隨朝露灑落在小路上的滴答聲，一場織於霧中的吟詠回蕩在那道身影的耳邊。陽光灑落在霧氣中，使周圍的一切朦朧，卻很明亮，就如同最初的房間那般，只不過空間內已經不再那樣潔白——那位小男孩，哦不，那位少年手中的筆卻從來沒有停過。</p>
<p data-source-paragraph="15">此時，那道身影似乎應該比任何時候都更能理解“陌生”是什麼。周圍的語言、建築、植物，甚至空氣里的氣味都不再屬於他所熟悉的世界。可奇怪的是，他並不需要誰去教他如何欣賞眼前的景象。那兩棵南洋杉不需要翻譯，清晨的霧氣也不需要註解。他只是站在那裡，看著它們。</p>
<p data-source-paragraph="16">正是在這種陌生之中，回憶將我帶回方才的拱門。我並不瞭解眼前世界的來龍去脈，也叫不出每一種植物的名字，可這並不妨礙我先被它吸引。就如同拱門上的精美圖紋，我無法叫出上面每一個圖案的名稱。特別是那些植物圖紋，我甚至認不出其中的任何一種。藝術從未替我解釋這個陌生的世界，卻讓我在完全理解它之前，先願意靠近它。</p>
<p data-source-paragraph="17">登上了台階，我來到了書架前，取下了字典。沒錯，我將用最直接的方法去尋找藝術的定義。翻開厚重的詞典，我進入到了一個人類文明的智慧結晶所創造的殿堂。沿著字母表順序，我輕鬆地找到了“藝術”一詞，不過完全理解其含義卻成為了一個挑戰：</p>
<p data-source-paragraph="18" class="essay-verse"><em>寄情於想象，</em></p>
<p data-source-paragraph="19" class="essay-verse"><em>托形於丹青。</em></p>
<p data-source-paragraph="20" class="essay-verse"><em>吾之所習，</em></p>
<p data-source-paragraph="21" class="essay-verse"><em>非科學之屬，亦未必嚴整。</em></p>
<p data-source-paragraph="22" class="essay-verse"><em>凡目之所悅、心之所賞，</em></p>
<p data-source-paragraph="23" class="essay-verse"><em>或無須言說，亦未有定名。</em></p>
<p data-source-paragraph="24">我盯著詞典中的每一個字母，試圖迫切尋出它們傳遞給我的那個答案。然而字母間的排列組合併沒有匯聚到一處焦點，相反，它們展現出的則是更多的可能性。雖然沒有尋得答案，我的嘴角卻依舊微微上揚。是啊，就連詞典也不能給“藝術”一個確切的定義。</p>
<p data-source-paragraph="25" class="essay-special"><strong>我，為什麼還要執著於尋求這個問題的答案呢？</strong></p>
<p data-source-paragraph="26">合上詞典，我的指尖仍停留在那幾頁薄薄的紙張上。也許答案從來沒有藏在某一行定義里，也沒有等待著被我從字母之間提取出來。那些我曾試圖歸類、判斷、證明的瞬間，早已散落在過去的某個角落，等著我重新回望。小男孩第一次提筆前，從來沒有人告訴他應在哪裡落筆。初次接觸一門語言，也許並不是找到它準確的定義，而是去看、去聽、去觸碰那些我們暫時還無法完全說清的東西。</p>
<p data-source-paragraph="27">記憶中的那道身影問道：“你在尋找什麼？”</p>
<p data-source-paragraph="28">“我在尋找藝術的...真諦？”</p>
<p data-source-paragraph="29">“那你找到了嗎？”</p>
<p data-source-paragraph="30">“我......找到了嗎？”</p>
<p data-source-paragraph="31">空間猶如畫卷被鋪開，青年站在原地，轉身看向身後，捲軸的起點照亮著另一個方向，那裡有著無人問津的拱門、蔥郁的南洋杉、轉身離去的小貓、海灘、三隻蠟筆，以及，一個潔白無暇的房間。那是他的旅程所踏出的一步步腳印，每一步都不大，連起來卻構成了一條獨屬於他的道路。而在沒有腳印的前方......依舊存在著青年聞所未聞之物。</p>
<p data-source-paragraph="32">他走了很遠，也畫了很多。捲軸前方依舊潔白，他仍不知道下一筆將會落在何處。</p>
