<h1>The Signifiers Here are Chaîned</h1>
<div class="essay-body" lang="en">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="2">“The sea.”</p>
<p data-source-paragraph="3">The sound spread outward, and the word sank into the blue before my eyes like a pebble falling into still water, sending ripples through memory. I tried to retrieve the word, only to find “blue” rising to the surface with it. Then came the traces of crayon on the wall and the slight upward inflection in my mother’s voice when she asked, “The sea?” The blue gradually lost the boundaries of the wall and spread outward in every direction. The sound of waves came from somewhere I could not identify. In the distance, the woman in the mist appeared again, along with the mandolin and the name that I could no longer erase from my sight.</p>
<p data-source-paragraph="4">I had only meant to retrieve a single word, yet I seemed to have disturbed the entire surface of the water.</p>
<p data-source-paragraph="5">The water did not return to stillness; the ripples had already begun to spread. “Sea” remained connected to “blue,” “blue” tugged at the traces of crayon, and behind the crayons was that white room. At the other end, the mandolin tugged at the woman, the woman at the title of the painting, and the title led me back into the mist. It seemed that whenever I tried to grasp one thing, it would pull another toward me as well.</p>
<p data-source-paragraph="6">Perhaps these words and images had never appeared alone.</p>
<p data-source-paragraph="7">“Signifiers,” a scholar said. Somehow, another scholar had appeared by the edge of the water.</p>
<p data-source-paragraph="8">“What?”</p>
<p data-source-paragraph="9">“Those things you pulled out of the water.” He looked toward the still-unsettled surface. “‘Sea,’ ‘blue,’ ‘crayon’—whenever you grasp a word, it always draws something else out with it.”</p>
<p data-source-paragraph="10">“So their meanings come from one another?”</p>
<p data-source-paragraph="11">The scholar looked toward the water but did not answer me directly. He bent down and picked the word “sea” out of the water. Strangely, as it left the surface, “blue,” the sound of waves, my mother’s voice, and even the distant woman in the mist were all tugged slightly by an invisible thread.</p>
<p data-source-paragraph="12">“A signifier,” he said, looking at the word in his hand, “rarely arrives at meaning alone.”</p>
<p data-source-paragraph="13">Move closer to an outline, and one can obtain a definition; learn the title, and one can fix the abstract in place. If I could string the signifiers together and follow them onward, perhaps I could reach “reality.” The scholar watched with great interest as I felt my way along one sign after another. He seemed to be waiting for something as well. But I was certain that whatever he was waiting for was not the same thing I was.</p>
<p data-source-paragraph="14">Lines, patches of color, eyes, nose, woman, strings, mandolin, ukulele… Wait. A ukulele? Why was that here? The chain had forked.</p>
<p data-source-paragraph="15">The water began to churn violently with my thoughts. I traced the interwoven threads of the memory backward. It seemed that someone who had once been walking beside me had casually asked, upon seeing the instrument, “Is that a ukulele?” I had forgotten those words long ago, yet they had never truly disappeared. Now, when I grasped “mandolin” once again, “ukulele” was dragged up from the bottom with it.</p>
<p data-source-paragraph="16">I stopped feeling my way along the signifiers. The scholar looked at my confusion and seemed to smile, “how do you know it has to be a straight line?”</p>
<p data-source-paragraph="17">I became even more puzzled. For a moment, I almost thought that the scholar had deliberately been waiting for me to make a fool of myself. But then another thought occurred to me: if a chain of signifiers can fork, then when we “translate art into language,” are we bringing art toward a more accurate meaning, or are we merely choosing one path among many? Do the path left away unchosen simply fall away into the abyss of the ocean?</p>
<p data-source-paragraph="18">The scholar seemed to notice that I was caught in a dilemma. He asked again: “Did they really fall away?”</p>
<p data-source-paragraph="19">I froze. Had not that “ukulele” just risen from the bottom of the water again? I had forgotten it for a long time, but when “mandolin” was tugged, it appeared once more. If a path had truly disappeared, how could I have stepped onto it again? Ah, the plant and the puppet in the morning mist. After the title of the work appeared, they seemed to have been replaced by the “woman.” Yet I still remembered them. They had simply become difficult to summon again, retreating deeper into the mist.</p>
<p data-source-paragraph="20">The surface of the water returned to its former calm.</p>
<p data-source-paragraph="21">“It seems they haven’t,” I answered the scholar. “I can still retrieve them from the water.”</p>
<p data-source-paragraph="22">The scholar gave a slight nod. He loosened his hand and let the chain pulled along by the word “sea” slip back into the water. The moment the word touched the surface, ripples spread outward once again. “Blue,” “crayon,” “woman,” “mandolin,” “ukulele”... the things I had just retrieved sank beneath the surface again, yet not one of them truly disappeared. I could still make out their blurred shadows; I simply could not know which one I would retrieve the next time I reached into the water.</p>
<p data-source-paragraph="23">I was suddenly no longer certain that continuing along this chain would ever lead me to some final meaning. Perhaps one more name, one more definition, would do no more than illuminate another route across the oceanic expanse of memory.</p>
<p data-source-paragraph="24">But what if I refused to choose among those paths?</p>
<p data-source-paragraph="25">What if, before the next stroke fell, before the name was spoken, I had never told myself what I was seeing? What if, like the scholar releasing his hand, I simply let the signs roam freely through the ocean? What, then, would I retrieve from it?</p>
<p data-source-paragraph="26">Then, let me try this out!</p>
<p data-source-paragraph="27">I imitated the scholar and opened my hand, allowing the chain to fall into the water. Ripples rose once more, and the scholar and I watched as the interwoven chains of signifiers gradually blurred beneath the surface.</p>
</div>

<template data-essay-language="zh" data-essay-lang="zh-CN">
<h1>这里的符号丝线交织</h1>
<div class="essay-body" lang="zh-CN">
<p class="essay-byline">启航</p>
<p data-source-paragraph="3">“海。”</p>
<p data-source-paragraph="4">声音传开了，文字沉入眼前的蓝色中，如同一颗石子落入平静的水面，泛起记忆的涟漪。我试图重新将文字捞起，却发现“蓝色”也一同浮出水面。随后，便是墙上蜡笔的痕迹、母亲问出“海”时微微扬起的语调。这片蓝色逐渐失去了墙壁的边界，向四周铺展开去。浪声从某个我无法辨认的方向传来，远处又浮现出雾中的女士、曼陀林，还有那个已经无法从视线中抹去的名字。</p>
<p data-source-paragraph="5">我原本只想捞起一个字，却似乎牵动了整片水面。</p>
<p data-source-paragraph="6">水面并没有重归平静，涟漪早已泛起。“海”与“蓝色”依旧相连，“蓝色”牵着蜡笔的痕迹，而蜡笔之后还有那洁白的房间。另一端，曼陀林牵着女士，女士牵着画作的名字，而那个名字又将我重新带回雾中。似乎每当我试图抓住其中一个事物，它都会将另一个一并拉向我。</p>
<p data-source-paragraph="7">或许，这些词语和图像从来不是单独出现的。</p>
<p data-source-paragraph="8">“能指，”不知何时，水边多了一位学者。</p>
<p data-source-paragraph="9">“什么？”</p>
<p data-source-paragraph="10">“你从水里捞出的那些。”他望着仍未平静的水面，“‘海’、‘蓝色’、‘蜡笔’——你抓住词汇，总是会牵出另一个东西。”</p>
<p data-source-paragraph="11">“所以，它们的意义来自彼此？”</p>
<p data-source-paragraph="12">学者看向水面，他没有直接回答。他弯下身，从水中拾起那个“海”字。奇怪的是，随着它离开水面，“蓝色”、浪声、母亲的声音，甚至远处雾中的女士都被一根看不见的细线牵动了一下。</p>
<p data-source-paragraph="13">“一个能指，”他看着手中的文字，“很少独自抵达意义。”</p>
<p data-source-paragraph="14">靠近轮廓，便能得到定义；知晓标题，便能固定抽象。若我将能指串起，沿着它走下去，便能抵达“真实”。学者兴致勃勃地看着我正在沿着一个个符号摸索的样子，他似乎也在期待着什么。不过我确信，他所期待的东西一定与我不同。</p>
<p data-source-paragraph="15">线条，色块，眼睛，鼻子，女士，琴弦，曼陀林，尤克里里。等一下，尤克里里？它为什么会出现在这儿？链条在此处分叉了。</p>
<p data-source-paragraph="16">水面随着我的思绪开始剧烈翻涌，我沿着记忆交织的线向上回溯。似乎曾有一个与我同行的人，在看见那件乐器时随口问过：“这是尤克里里吗？”那句话早已被我遗忘，可它并没有真正消失。如今，当我再次抓住“曼陀林”时，它竟也被一并从水底拖了出来。</p>
<p data-source-paragraph="17">我停下了手中摸索符号的动作。学者看着我疑惑的模样，似乎是笑了一下，“你怎么知道它一定是一条直线呢？”</p>
<p data-source-paragraph="18">我更加困惑了，居然有一瞬间觉得学者在故意等着我出丑。不过转念一想，如果符号链会分叉，那“翻译成语言”究竟是在把艺术带向更准确的意义，还是只是选择了其中一条路径？未被选择的路径就此坠落于汪洋的深渊之中了吗？</p>
<p data-source-paragraph="19">学者仿佛看出了我的困境，他再次发问：“真的坠落了吗？”</p>
<p data-source-paragraph="20">我愣了一下。方才那个“尤克里里”不正是从水底重新浮上来的吗？它已经被我遗忘了许久，却在“曼陀林”被牵动时再次出现。如果一条小径真的已经消失，我又怎会重新踏上它。是啊，清晨雾中的植物与人偶。在作品的名字出现以后，它们似乎都被“女士”取代了。我依旧记得它们，只是很难被再度唤起，于是它们退到了更深的雾里。</p>
<p data-source-paragraph="21">水面恢复了以往的平静。</p>
<p data-source-paragraph="22">“好像并没有，我依旧能够将它们从水中捞起。”我回答学者道。</p>
<p data-source-paragraph="23">学者微微点了一下头。他松开手，任由那个“海”字所牵引的链条滑落回水中。文字接触水面的瞬间，涟漪再次荡开。“蓝色”、“蜡笔”、“女士”、“曼陀林”、“尤克里里”……那些刚刚被我捞起的东西重新沉入水下，却没有一个真正消失。我依然可以看见它们模糊的影子，只是无法确定下一次伸手时，究竟会捞起哪一个。</p>
<p data-source-paragraph="24">我忽然不再确信，继续沿着这根链条走下去，是否真的能够抵达某个最终的意义。也许再多一个名字、再多一个定义，也不过是在记忆汪洋中多照亮一条航路。</p>
<p data-source-paragraph="25">可如果不选择呢？如果在下一笔落下以前，在名字被说出口以前，我从来没有告诉自己看见了什么。就像学者将手松开，任由符号在汪洋中遨游。我又将从汪洋中取得何物？</p>
<p data-source-paragraph="26">那就让我试一下吧！于是我模仿着学者的样子，松开手，任由那根链条落入水中。涟漪在荡起，我和学者看着交织的能指链条渐渐在水中变得模糊。</p>
</div>

<h1>這裡的符號絲線交織</h1>

<p data-source-paragraph="15">線條，色塊，眼睛，鼻子，女士，琴弦，曼陀林，尤克里里。等一下，尤克里里？它為什麼會出現在這兒？鏈條在此處分叉了。</p>
<p data-source-paragraph="16">水面隨著我的思緒開始劇烈翻湧，我沿著記憶交織的線向上回溯。似乎曾有一個與我同行的人，在看見那件樂器時隨口問過：“這是尤克里里嗎？”那句話早已被我遺忘，可它並沒有真正消失。如今，當我再次抓住“曼陀林”時，它竟也被一並從水底拖了出來。</p>
<p data-source-paragraph="17">我停下了手中摸索符號的動作。學者看著我疑惑的模樣，似乎是笑了一下，“你怎麼知道它一定是一條直線呢？”</p>
<p data-source-paragraph="18">我更加困惑了，居然有一瞬間覺得學者在故意等著我出醜。不過轉念一想，如果符號鏈會分叉，那“翻譯成語言”究竟是在把藝術帶向更準確的意義，還是只是選擇了其中一條路徑？未被選擇的路徑就此墜落於汪洋的深淵之中了嗎？</p>
<p data-source-paragraph="19">學者彷彿看出了我的困境，他再次發問：“真的墜落了嗎？”</p>
<p data-source-paragraph="20">我愣了一下。方才那個“尤克里里”不正是從水底重新浮上來的嗎？它已經被我遺忘了許久，卻在“曼陀林”被牽動時再次出現。如果一條小徑真的已經消失，我又怎會重新踏上它。是啊，清晨霧中的植物與人偶。在作品的名字出現以後，它們似乎都被“女士”取代了。我依舊記得它們，只是很難被再度喚起，於是它們退到了更深的霧裡。</p>
<p data-source-paragraph="21">水面恢復了以往的平靜。</p>
<p data-source-paragraph="22">“好像並沒有，我依舊能夠將它們從水中撈起。”我回答學者道。</p>
<p data-source-paragraph="23">學者微微點了一下頭。他松開手，任由那個“海”字所牽引的鏈條滑落回水中。文字接觸水面的瞬間，漣漪再次蕩開。“藍色”、“蠟筆”、“女士”、“曼陀林”、“尤克里里”……那些剛剛被我撈起的東西重新沈入水下，卻沒有一個真正消失。我依然可以看見它們模糊的影子，只是無法確定下一次伸手時，究竟會撈起哪一個。</p>
<p data-source-paragraph="24">我忽然不再確信，繼續沿著這根鏈條走下去，是否真的能夠抵達某個最終的意義。也許再多一個名字、再多一個定義，也不過是在記憶汪洋中多照亮一條航路。</p>
<p data-source-paragraph="25">可如果不選擇呢？如果在下一筆落下以前，在名字被說出口以前，我從來沒有告訴自己看見了什麼。就像學者將手松開，任由符號在汪洋中遨遊。我又將從汪洋中取得何物？</p>
<p data-source-paragraph="26">那就讓我試一下吧！於是我模仿著學者的樣子，松開手，任由那根鏈條落入水中。漣漪在蕩起，我和學者看著交織的能指鏈條漸漸在水中變得模糊。</p>
</div>
</template>
<template data-essay-language="ja" data-essay-lang="ja">
<h1>ここで連なり合うシニフィアン</h1>
<div class="essay-body" lang="ja">
<p class="essay-byline">啓航</p>
<p data-source-paragraph="2">「海。」</p>
<p data-source-paragraph="3">声が広がり、その言葉は、静かな水面に落ちた小石のように目の前の青へ沈み、記憶に波紋を広げた。言葉をすくい上げようとすると、「青」まで一緒に浮かび上がった。続いて、壁のクレヨンの跡や、「海？」と尋ねたときの母親の、わずかに上がる声の調子が現れた。青は次第に壁の境界を失い、四方へ広がっていった。どこからとも知れず波の音が届いた。遠くには、霧の中の女性とマンドリン、そしてもう視界から消せなくなった名前が、また浮かんできた。</p>
<p data-source-paragraph="4">たった一つの言葉をすくい上げるつもりだったのに、水面全体を動かしてしまったようだった。</p>
<p data-source-paragraph="5">水面は静けさを取り戻さず、波紋はもう広がり始めていた。「海」は「青」とつながったままで、「青」はクレヨンの跡を引き、そのクレヨンの向こうには、あの白い部屋があった。もう一方では、マンドリンが女性を引き、女性が絵の題名を引き、その題名が私を霧の中へ連れ戻した。何か一つをつかもうとするたびに、それは別の何かまで私の方へ引き寄せるようだった。</p>
<p data-source-paragraph="6">もしかすると、これらの言葉やイメージは、一度も単独で現れたことがなかったのかもしれない。</p>
<p data-source-paragraph="7">「シニフィアンだ」と、学者が言った。いつの間にか、水辺にもう一人の学者が現れていた。</p>
<p data-source-paragraph="8">「何ですか？」</p>
<p data-source-paragraph="9">「君が水から引き上げたものだよ。」彼は、まだ揺れている水面を見た。「『海』、『青』、『クレヨン』。言葉をつかむと、いつも別の何かが一緒に引き出される。」</p>
<p data-source-paragraph="10">「では、それらの意味は、互いから生まれるのですか？」</p>
<p data-source-paragraph="11">学者は水面を見たが、私には直接答えなかった。身をかがめ、水の中から「海」という言葉を拾い上げた。不思議なことに、それが水面を離れると、「青」も、波の音も、母親の声も、遠い霧の中の女性さえも、見えない細い糸にかすかに引かれた。</p>
<p data-source-paragraph="12">「一つのシニフィアンが」と、彼は手の中の言葉を見つめて言った。「たった一つで意味にたどり着くことは、めったにない。」</p>
<p data-source-paragraph="13">輪郭に近づけば定義が得られ、題名を知れば抽象をその場に固定できる。シニフィアンをつなぎ、その先をたどれば、「現実」に届くのかもしれない。私が一つ、また一つと記号を手探りする様子を、学者は興味深そうに見ていた。彼もまた、何かを待っているようだった。けれど、彼の待つものは、きっと私の待つものとは違う。そう確信していた。</p>
<p data-source-paragraph="14">線、色面、目、鼻、女性、弦、マンドリン、ウクレレ……待って。ウクレレ？どうしてそれがここにあるのだろう。連鎖が枝分かれしていた。</p>
<p data-source-paragraph="15">思いにつれて、水面が激しく波立ち始めた。私は記憶の織りなす糸を、逆へたどった。かつて隣を歩いていた誰かが、あの楽器を見て何気なく「これ、ウクレレ？」と尋ねたことがあったようだった。その言葉はとうに忘れていたが、本当に消えたわけではなかった。いま、もう一度「マンドリン」をつかむと、「ウクレレ」も一緒に水底から引き上げられたのだ。</p>
<p data-source-paragraph="16">私はシニフィアンを手探りする手を止めた。戸惑う私を見て、学者は少し笑ったようだった。「どうして、それがまっすぐな一本の線だとわかるんだい？」</p>
<p data-source-paragraph="17">私はますます困惑した。一瞬、学者は私が恥をかくのを、わざと待っていたのではないかとさえ思った。だが、考え直した。シニフィアンの連鎖が枝分かれするのなら、私たちが「芸術を言葉に翻訳する」とき、それは芸術をより正確な意味へ導いているのだろうか。それとも、いくつもある道の一つを選んでいるだけなのだろうか。選ばれずに残った道は、そのまま大海の深淵へ落ちていくのだろうか。</p>
<p data-source-paragraph="18">学者は私の行き詰まりに気づいたようだった。彼はもう一度尋ねた。「本当に落ちていったのかな？」</p>
<p data-source-paragraph="19">私ははっとした。あの「ウクレレ」は、ついさっき水底から再び浮かんできたばかりではないか。長いあいだ忘れていたのに、「マンドリン」が引かれると、また現れた。もし道が本当に消えていたなら、どうして再びそこへ足を踏み入れられるのだろう。そうだ、朝霧の中の植物と人形。作品の名前が現れたあと、どちらも「女性」に取って代わられたようだった。それでも、私は覚えている。ただ、もう一度呼び起こすことが難しくなり、霧のいっそう深いところへ退いていただけなのだ。</p>
<p data-source-paragraph="20">水面は、もとの静けさを取り戻した。</p>
<p data-source-paragraph="21">「どうやら、落ちてはいないようです」と、私は学者に答えた。「まだ、水からすくい上げられます。」</p>
<p data-source-paragraph="22">学者は小さくうなずいた。手をゆるめ、「海」という言葉に引かれた連鎖を、水の中へ滑り戻した。言葉が水面に触れた瞬間、波紋がまた広がった。「青」、「クレヨン」、「女性」、「マンドリン」、「ウクレレ」……いましがた引き上げたものは、再び水の下へ沈んだが、本当に消えたものは一つもなかった。かすんだ影は、まだ見えていた。ただ、次に手を伸ばしたとき、どれをすくい上げるのか、それだけはわからなかった。</p>
<p data-source-paragraph="23">この連鎖をたどり続ければ、いつか最後の意味にたどり着けるのだろうか。不意に、その確信がなくなった。名前が一つ、定義が一つ増えても、記憶の大海に、もう一本の航路を照らすだけなのかもしれない。</p>
<p data-source-paragraph="24">けれど、その道のどれを選ぶことも、拒んだとしたら？</p>
<p data-source-paragraph="25">次のひと筆が落ちる前に、名前が口にされる前に、自分が何を見ているのか、一度も自分に告げなかったとしたら？手を放す学者のように、記号をただ大海に自由に泳がせたとしたら？そのとき私は、そこから何をすくい上げるのだろう？</p>
<p data-source-paragraph="26">それなら、試してみよう！</p>
<p data-source-paragraph="27">私は学者のまねをして手を開き、連鎖を水の中へ落とした。波紋がまた立ち、私と学者は、織りなされたシニフィアンの連鎖が、水の下で次第にぼやけていくのを見ていた。</p>
</div>
</template>
<template data-essay-language="fr" data-essay-lang="fr">
<h1>Ici, les signifiants s’enchaînent</h1>
<div class="essay-body" lang="fr">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="2">« La mer. »</p>
<p data-source-paragraph="3">Le son se propagea, et le mot s’enfonça dans le bleu devant mes yeux, comme un caillou tombant dans une eau calme, faisant courir des rides à travers la mémoire. Je tentai de repêcher le mot, mais « bleu » remonta avec lui. Puis vinrent les traces de crayon sur le mur et la légère inflexion montante de la voix de ma mère lorsqu’elle avait demandé : « La mer ? » Le bleu perdit peu à peu les limites du mur et s’étendit dans toutes les directions. Un bruit de vagues venait d’un endroit que je ne pouvais situer. Au loin, la femme dans la brume réapparut, avec la mandoline et le nom que je ne pouvais plus effacer de mon regard.</p>
<p data-source-paragraph="4">Je n’avais voulu repêcher qu’un seul mot, et pourtant j’avais, semblait-il, remué toute la surface de l’eau.</p>
<p data-source-paragraph="5">L’eau ne retrouva pas son calme ; les rides avaient déjà commencé à se propager. « Mer » restait lié à « bleu », « bleu » tirait sur les traces de crayon, et derrière les crayons se trouvait cette pièce blanche. À l’autre bout, la mandoline tirait sur la femme, la femme sur le titre du tableau, et le titre me ramenait dans la brume. Chaque fois que je tentais de saisir une chose, elle semblait en attirer une autre vers moi.</p>
<p data-source-paragraph="6">Peut-être ces mots et ces images n’étaient-ils jamais apparus seuls.</p>
<p data-source-paragraph="7">« Des signifiants », dit un savant. Un autre savant était apparu, je ne sais quand, au bord de l’eau.</p>
<p data-source-paragraph="8">« Quoi ? »</p>
<p data-source-paragraph="9">« Ces choses que vous avez tirées de l’eau. » Il regarda la surface encore agitée. « “Mer”, “bleu”, “crayon” : chaque fois que vous saisissez un mot, il en entraîne toujours autre chose. »</p>
<p data-source-paragraph="10">« Alors, leurs sens viennent les uns des autres ? »</p>
<p data-source-paragraph="11">Le savant regarda l’eau sans me répondre directement. Il se pencha et en retira le mot « mer ». Étrangement, tandis que le mot quittait la surface, « bleu », le bruit des vagues, la voix de ma mère et même la femme lointaine dans la brume furent tous légèrement tirés par un fil invisible.</p>
<p data-source-paragraph="12">« Un signifiant, dit-il en regardant le mot dans sa main, arrive rarement seul au sens. »</p>
<p data-source-paragraph="13">S’approcher d’un contour permet d’obtenir une définition ; apprendre le titre permet de fixer l’abstrait. Si je pouvais relier les signifiants et les suivre, peut-être atteindrais-je la « réalité ». Le savant m’observait avec un vif intérêt tandis que je tâtonnais d’un signe à l’autre. Lui aussi semblait attendre quelque chose. Mais j’étais certain que ce qu’il attendait n’était pas la même chose que moi.</p>
<p data-source-paragraph="14">Lignes, plages de couleur, yeux, nez, femme, cordes, mandoline, ukulélé… Un instant. Un ukulélé ? Que faisait-il ici ? La chaîne avait bifurqué.</p>
<p data-source-paragraph="15">L’eau se mit à bouillonner violemment avec mes pensées. Je remontai les fils entrelacés de la mémoire. Il me semblait qu’une personne qui marchait autrefois à mes côtés avait demandé, sans y penser, en voyant cet instrument : « C’est un ukulélé ? » J’avais oublié ces mots depuis longtemps, mais ils n’avaient jamais véritablement disparu. Maintenant que je saisissais de nouveau « mandoline », « ukulélé » était remonté du fond avec lui.</p>
<p data-source-paragraph="16">Je cessai de tâtonner le long des signifiants. Le savant regarda ma confusion et sembla sourire. « Comment savez-vous qu’il doit s’agir d’une ligne droite ? »</p>
<p data-source-paragraph="17">Je fus encore plus perplexe. Un instant, je crus presque que le savant attendait délibérément que je me couvre de ridicule. Mais une autre pensée me vint : si une chaîne de signifiants peut bifurquer, alors, lorsque nous « traduisons l’art en langage », conduisons-nous l’art vers un sens plus exact, ou choisissons-nous simplement un chemin parmi d’autres ? Les chemins laissés de côté tombent-ils tout simplement dans les abysses de l’océan ?</p>
<p data-source-paragraph="18">Le savant sembla voir mon dilemme. Il demanda encore : « Sont-ils vraiment tombés ? »</p>
<p data-source-paragraph="19">Je restai figé. Cet « ukulélé » ne venait-il pas justement de remonter du fond de l’eau ? Je l’avais oublié depuis longtemps, mais, quand on avait tiré sur « mandoline », il était réapparu. Si un chemin avait vraiment disparu, comment aurais-je pu l’emprunter à nouveau ? Ah, la plante et la marionnette dans la brume du matin. Après l’apparition du titre de l’œuvre, elles semblaient avoir été remplacées par la « femme ». Pourtant, je m’en souvenais encore. Elles étaient simplement devenues difficiles à rappeler, retirées plus profondément dans la brume.</p>
<p data-source-paragraph="20">La surface de l’eau retrouva son calme d’autrefois.</p>
<p data-source-paragraph="21">« Il semble que non, répondis-je au savant. Je peux encore les repêcher. »</p>
<p data-source-paragraph="22">Le savant hocha légèrement la tête. Il desserra la main et laissa la chaîne entraînée par le mot « mer » glisser dans l’eau. Dès que le mot toucha la surface, les rides s’élargirent à nouveau. « Bleu », « crayon », « femme », « mandoline », « ukulélé »… les choses que je venais de repêcher s’enfoncèrent encore sous la surface, mais aucune ne disparut vraiment. Je distinguais toujours leurs ombres floues ; je ne pouvais simplement pas savoir laquelle je ramènerais la prochaine fois que je tendrais la main dans l’eau.</p>
<p data-source-paragraph="23">Soudain, je n’étais plus certain que poursuivre cette chaîne me conduirait jamais à un sens final. Peut-être un nom de plus, une définition de plus, ne ferait-il qu’éclairer une route supplémentaire à travers l’immensité océanique de la mémoire.</p>
<p data-source-paragraph="24">Mais si je refusais de choisir parmi ces chemins ?</p>
<p data-source-paragraph="25">Si, avant que le prochain trait se pose, avant que le nom soit prononcé, je ne m’étais jamais dit ce que je voyais ? Si, comme le savant ouvrant la main, je laissais simplement les signes parcourir librement l’océan ? Qu’en retirerais-je alors ?</p>
<p data-source-paragraph="26">Alors, essayons !</p>
<p data-source-paragraph="27">J’imitai le savant et ouvris la main, laissant la chaîne tomber dans l’eau. Des rides se levèrent encore, et le savant et moi regardâmes les chaînes de signifiants entrelacées se brouiller peu à peu sous la surface.</p>
</div>
