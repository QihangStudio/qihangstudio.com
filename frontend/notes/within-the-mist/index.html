<h1>Within the Mist</h1>
<div class="essay-body" lang="en">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="2">The dawn light fell into the mist, scattered by countless tiny droplets and evenly dissolved into it, leaving behind a boundless brightness. The distant scenery hid within it, its colors indistinguishable and its textures impossible to make out.</p>
<p data-source-paragraph="3">I wandered through the mist as blurred outlines gradually separated themselves from the nebulous distance, tracing broken and intermittent segments. These scattered fragments slowly gathered into a protruding edge, a winding line, or perhaps a distinctive shape. They extended through the mist like abstract threads, and each step I took caused several of them to overlap. Only when the hazy outlines came so close that they almost grazed the tip of my nose did the threads and shadows construct a seemingly complete form.</p>
<p data-source-paragraph="4">One edge joined another line, and one patch of shadow filled another blank space. Those fragments finally pieced together into something recognizable, and our puzzle game came to an end. You would probably think the same: as long as there are enough clues, as long as we come close enough, a blurred outline will eventually acquire its definition.</p>
<p data-source-paragraph="5">I paused my stride, squinted into the haze, and tried to see those outlines more clearly. If I looked just a little more carefully, all shall submit to my gaze.</p>
<p data-source-paragraph="6">Yet the lines that had just gathered together did not seem willing to stay in place. The shape before me looked like a person, and then like some kind of plant; one patch of shadow had just allowed me to recognize a face, only for its features to disappear again with the movement of the mist. I did not know what I was actually seeing.</p>
<p data-source-paragraph="7">Gradually, one of the outlines began to resemble a human figure, though the proportions of its body were particularly strange. Simple lines, after seemingly casual distortions and combinations, somehow came together to form a young woman and a mandolin. The young woman was seated on a chair, her body leaning slightly to one side. Her body had no clearly defined boundaries. Her shoulders, arms, and torso seemed to have been taken apart and reassembled, making her look, at first glance, more like a puppet. Patches of pale blue, light purple, and yellow pressed against one another, barely separated by several curved black lines. I could hardly tell where her shoulders ended or where her arms began. Some curves seemed, for a moment, to trace the outer edge of her body, only to slip into another patch of color the next moment and become the boundary of an entirely different part. Her arms seemed to fall along both sides of the chair, while the mandolin lay horizontally below.</p>
<p data-source-paragraph="8">I shifted my gaze upward and began to examine the woman’s head. A continuous curve traced her profile: her forehead gradually extended toward the bridge of her nose, the tip of her nose tilted slightly upward, her lips were pressed together, and the line then suddenly narrowed again at her chin. In the opposite direction from her forehead, several shorter curves stretched toward the back of her head, resembling strands of loose hair, or perhaps traces that had not yet fully separated themselves from the mist. Lines on either side of her nose formed the woman’s closed eyes.</p>
<p data-source-paragraph="9">But why could I see both of her eyes when the woman was facing me in profile?</p>
<p data-source-paragraph="10">I blinked. The two eyes were still there, as though frozen in the mist. I raised a finger and traced through the air, trying to imitate the lines before me. I narrowed one eye and let the gaze of the other pass beyond my fingertip, following the bridge of the woman’s nose as I tried once again to locate the direction in which her profile should have faced. Once I managed to align the lines, at some peculiar angle, with the image that ought to have appeared according to my own understanding, the scene before me became comprehensible.</p>
<p data-source-paragraph="11">The curve that had seemed so clear only moments earlier now appeared to shift slightly with my gaze. She was still turned to the side, yet she was still facing me directly. It was as though whenever I fixed my attention on one part, another would seize the opportunity to change its position. I lowered my head and then looked up again.  Perhaps the lines before me were secretly shifting with the mist. Although I tried to keep my finger and the curve horizontally aligned with my line of sight, I could never quite manage it. The chair had not moved. The mandolin had not moved. Even the mist around me seemed to have frozen in place. Yet her face was already slightly different from what it had been moments before.</p>
<p data-source-paragraph="12">Strangely, I did not find any of this particularly strange.</p>
<p data-source-paragraph="13">Hold on… was that outline really a woman?</p>
<p data-source-paragraph="14">Perhaps I had never recognized her at all. Perhaps I was reconstructing her. Yet I could not remember how this woman had appeared before me. An outline traced by curves, a body assembled from patches of color – she seemed to have been “gathered” so naturally from these undefined fragments. Perhaps it was some coincidence, or perhaps certain concepts had already taken hold of my mind before I even began to look – the scene before me had already been given a name: Young Woman with Mandolin.</p>
<p data-source-paragraph="15">Ah, the mist thinned a little. With the arrival of the name, the undefined patches revealed their definitions and became fixed within my sight. They no longer drifted uncertainly, hidden behind layer after layer of mist. The definition brought by the name was like an iron nail, pinning every outline onto a wall made of mist. Fragments that moments ago might still have belonged to a plant or a puppet could now construct only the image of a woman and a mandolin. I could no longer see them as anything else. The mist thinned a little more, adding another degree of certainty to the scene before me, yet something also seemed to vanish quietly along with it.</p>
<p data-source-paragraph="16">Perhaps it was chaos, an enigma, a mystery; perhaps it was a place at the end of a path where no one had ever set foot, a stroke still waiting to fall, a trajectory not yet anchored by fate.</p>
<p data-source-paragraph="17">I stared at the lines and planes before me, forcing myself not to think of a “woman,” nor of a “mandolin.” But it was too late. I could no longer see the body of the instrument as merely an oval, nor the head as merely a curve.</p>
<p data-source-paragraph="18">Dear reader, if I had never told you the name of this work, how would you have constructed these fragments?</p>
</div>

<h1>迷雾之中</h1>
<div class="essay-body" lang="zh-CN">
<p class="essay-byline">启航</p>
<p data-source-paragraph="3">清晨的曙光落入雾中，被无数细小水滴揉散后均匀地晕染开来，留下了无边的明光。远处的景色藏匿其中，分不清颜色，也辨不出纹理。</p>
<p data-source-paragraph="4">我漫步在雾气中，一些模糊的轮廓渐渐地从远处的混沌中剥离开来，勾勒出断断续续的边缘。这些边缘渐渐聚合成了一个突出的棱角，一段曲折的线条，亦或是一个独特的形状。这些零散的碎片如同一根根抽象的细丝在雾中延展，我迈出的每一步都让几根细丝彼此交叠。直到模糊的轮廓近到几乎贴到我的鼻尖时，细丝与阴影才搭建出一个似乎完整的样貌。</p>
<p data-source-paragraph="5">一个棱角接上一段线条，一片阴影填补另一片空白，散落在雾中的碎片终于拼凑出了某种可以辨认的东西，我们的猜谜游戏便结束了。你大概也会这样想：只要线索足够多，只要我们靠得足够近，一个模糊的轮廓终究会获得自己的定义。</p>
<p data-source-paragraph="6">那我便停下脚步，眯起眼睛，去尝试看清那些轮廓。只要再认真些，眼前的一切便会服从我的视线。</p>
<p data-source-paragraph="7">刚刚聚合起来的线条似乎并不安分守己，眼前的形状像人，又像某种植物；一处阴影刚刚让我认出一张脸，下一刻却又随着雾气的流动失去了五官。我并不知道究竟看到了什么。</p>
<p data-source-paragraph="8">其中的一个轮廓越来越像一个人物，但它的身体比例却尤为奇怪。简洁的线条经过看似随意的扭曲与组合，竟神奇地拼凑出一位年轻的女士与一把曼陀林。这位年轻的女士正坐在一把椅子上，身体微微向一侧倾斜。这具身体并没有清晰的边界。肩膀、手臂与躯干像是被拆散后重新拼接在了一起，乍一看更偏向于一个人偶。淡蓝、浅紫与浅黄的色块相互挤压，又被几道弯曲的黑线勉强分隔开来。我很难指出她的肩膀究竟在哪里结束，手臂又是从哪里开始。一些弧线刚刚像是在勾勒身体的外沿，下一刻却钻进另一块颜色之中，成为了另外一个部分的边界。她的双臂似乎顺着身体垂落在椅子的两侧，而那把曼陀林则横亘在下方。</p>
<p data-source-paragraph="9">视线向上，我端详起女士的头部。一条连续的弧线勾勒出她的侧颜：额头缓缓延伸至鼻梁，鼻尖微微翘起，嘴唇抿紧，随后又在下巴处忽然收拢。额头的另外一个方向排列着几道较短的曲线，朝着脑后散落，好似女士散落的头发，亦或是雾中尚未完全分离出的痕迹。鼻翼两侧的线条组成了女士闭拢的双眼。</p>
<p data-source-paragraph="10">可是，我为什么可以同时看到这位侧脸朝着我的女士的双眼呢？</p>
<p data-source-paragraph="11">我眨了眨眼，那两只眼睛依旧在那里，仿佛在雾气中定格了。我伸出手指在空中比划，试图临摹出面前的线条。我将一只眼睛眯起，让另一只眼的视线越过指尖，沿着女士的鼻梁重新寻找她侧脸应有的方向。一旦我将线条以某种神奇的角度匹配上我认知中理应出现的景象，眼前的景象便可以被我理解。</p>
<p data-source-paragraph="12">刚才还清晰的弧线似乎随着我的视线悄悄移动了几分。她仍然侧着脸，却也仍然正对着我。仿佛只要我盯住其中一处，另一处便会趁机改变自己的位置。我低下头，又重新抬起头。不知是不是眼前的线条正随着雾气偷偷位移，尽管我努力控制手指与弧线水平对齐我的视线，可我却始终无法做到。椅子没有移动，曼陀林没有移动，甚至连周围的雾似乎都凝固在那里，可她的脸已经与方才有些不同。</p>
<p data-source-paragraph="13">奇怪的是，我并没有觉得这一切有多么奇怪。</p>
<p data-source-paragraph="14">等等，她果真是一位女士？</p>
<p data-source-paragraph="15">或许，我从来没有认出她。或许，我在重构她。但是，我记不清这位女士是如何出现在我的面前。曲线勾勒的轮廓，色块组成的躯干，她似乎就这么自然而然地被这些没有定义的碎片“聚合”了。这也许是某种机缘巧合，亦或是某些概念早已先入为主——我面前的场景已经被人命名了：《弹奏曼陀林的少女》。</p>
<p data-source-paragraph="16">啊，雾气消散了些。未被定义的区块随着名字展现了自己的定义，并固定在我的视线中。它们不再像之前那样，隐匿在层层雾气之后飘忽不定。名字所带来的定义如同一颗铁钉将所有的轮廓固定在了由雾气构成的墙面中。方才还有可能是一株植物、一个人偶的些许碎片如今只能构建出女士与曼陀林的形象。如今，我再也无法将它们视作他物。雾气又消散了些，为面前的景象又增加了一分笃定，但是似乎也有什么悄然随着雾气消逝。</p>
<p data-source-paragraph="17">也许是混沌，是迷思，是神秘，是小径尽头从未有人涉足之地，是画作中仍未落下的一笔，是未被命运锚定的轨迹。</p>
<p data-source-paragraph="18">我盯着面前的线与面，强迫自己不要想“女士”，也不要想“曼陀林”。可是为时已晚，我已无法将琴身之看作椭圆、将头部看作曲线。</p>
<p data-source-paragraph="19">读者啊，假如我从未将这个名称告知与你，你又将如何构建这些碎片呢？</p>
</div>
</template>

<div class="essay-body" lang="zh-Hant">
<p class="essay-byline">啟航</p>
<p data-source-paragraph="3">清晨的曙光落入霧中，被無數細小水滴揉散後均勻地暈染開來，留下了無邊的明光。遠處的景色藏匿其中，分不清顏色，也辨不出紋理。</p>

<p data-source-paragraph="7">剛剛聚合起來的線條似乎並不安分守己，眼前的形狀像人，又像某種植物；一處陰影剛剛讓我認出一張臉，下一刻卻又隨著霧氣的流動失去了五官。我並不知道究竟看到了什麼。</p>
<p data-source-paragraph="8">其中的一個輪廓越來越像一個人物，但它的身體比例卻尤為奇怪。簡潔的線條經過看似隨意的扭曲與組合，竟神奇地拼湊出一位年輕的女士與一把曼陀林。這位年輕的女士正坐在一把椅子上，身體微微向一側傾斜。這具身體並沒有清晰的邊界。肩膀、手臂與軀乾像是被拆散後重新拼接在了一起，乍一看更偏向於一個人偶。淡藍、淺紫與淺黃的色塊相互擠壓，又被幾道彎曲的黑線勉強分隔開來。我很難指出她的肩膀究竟在哪裡結束，手臂又是從哪裡開始。一些弧線剛剛像是在勾勒身體的外沿，下一刻卻鑽進另一塊顏色之中，成為了另外一個部分的邊界。她的雙臂似乎順著身體垂落在椅子的兩側，而那把曼陀林則橫亙在下方。</p>
<p data-source-paragraph="9">視線向上，我端詳起女士的頭部。一條連續的弧線勾勒出她的側顏：額頭緩緩延伸至鼻梁，鼻尖微微翹起，嘴唇抿緊，隨後又在下巴處忽然收攏。額頭的另外一個方向排列著幾道較短的曲線，朝著腦後散落，好似女士散落的頭髮，亦或是霧中尚未完全分離出的痕跡。鼻翼兩側的線條組成了女士閉攏的雙眼。</p>
<p data-source-paragraph="10">可是，我為什麼可以同時看到這位側臉朝著我的女士的雙眼呢？</p>
<p data-source-paragraph="11">我眨了眨眼，那兩隻眼睛依舊在那裡，彷彿在霧氣中定格了。我伸出手指在空中比劃，試圖臨摹出面前的線條。我將一隻眼睛眯起，讓另一隻眼的視線越過指尖，沿著女士的鼻梁重新尋找她側臉應有的方向。一旦我將線條以某種神奇的角度匹配上我認知中理應出現的景象，眼前的景象便可以被我理解。</p>
<p data-source-paragraph="12">剛才還清晰的弧線似乎隨著我的視線悄悄移動了幾分。她仍然側著臉，卻也仍然正對著我。彷彿只要我盯住其中一處，另一處便會趁機改變自己的位置。我低下頭，又重新抬起頭。不知是不是眼前的線條正隨著霧氣偷偷位移，儘管我努力控制手指與弧線水平對齊我的視線，可我卻始終無法做到。椅子沒有移動，曼陀林沒有移動，甚至連周圍的霧似乎都凝固在那裡，可她的臉已經與方才有些不同。</p>
<p data-source-paragraph="13">奇怪的是，我並沒有覺得這一切有多麼奇怪。</p>
<p data-source-paragraph="14">等等，她果真是一位女士？</p>
<p data-source-paragraph="15">或許，我從來沒有認出她。或許，我在重構她。但是，我記不清這位女士是如何出現在我的面前。曲線勾勒的輪廓，色塊組成的軀乾，她似乎就這麼自然而然地被這些沒有定義的碎片“聚合”了。這也許是某種機緣巧合，亦或是某些概念早已先入為主——我面前的場景已經被人命名了：《彈奏曼陀林的少女》。</p>
<p data-source-paragraph="16">啊，霧氣消散了些。未被定義的區塊隨著名字展現了自己的定義，並固定在我的視線中。它們不再像之前那樣，隱匿在層層霧氣之後飄忽不定。名字所帶來的定義如同一顆鐵釘將所有的輪廓固定在了由霧氣構成的牆面中。方才還有可能是一株植物、一個人偶的些許碎片如今只能構建出女士與曼陀林的形象。如今，我再也無法將它們視作他物。霧氣又消散了些，為面前的景象又增加了一分篤定，但是似乎也有什麼悄然隨著霧氣消逝。</p>
<p data-source-paragraph="17">也許是混沌，是迷思，是神秘，是小徑盡頭從未有人涉足之地，是畫作中仍未落下的一筆，是未被命運錨定的軌跡。</p>
<p data-source-paragraph="18">我盯著面前的線與面，強迫自己不要想“女士”，也不要想“曼陀林”。可是為時已晚，我已無法將琴身之看作橢圓、將頭部看作曲線。</p>
<p data-source-paragraph="19">讀者啊，假如我從未將這個名稱告知與你，你又將如何構建這些碎片呢？</p>
</div>
</template>
<template data-essay-language="ja" data-essay-lang="ja">
<h1>霧の中で</h1>
<div class="essay-body" lang="ja">
<p class="essay-byline">啓航</p>
<p data-source-paragraph="2">夜明けの光が霧の中へ差し込み、無数の小さな水滴にほぐされて、むらなく溶け広がっていた。あとには、果てのない明るさだけが残った。遠くの景色はその中に隠れ、色も見分けられず、手触りのような細部も読み取れなかった。</p>
<p data-source-paragraph="3">霧の中を歩いていると、ぼんやりした輪郭が、遠くの混沌から少しずつ剥がれ出し、途切れ途切れの線を描き始めた。散らばっていた断片は、突き出た角や曲がりくねった線、あるいは独特の形へと、ゆっくり集まっていった。それらは抽象的な細い糸のように霧の中へ伸び、一歩進むたびに、何本かが互いに重なった。かすんだ輪郭が鼻先に触れそうなほど近づいて、ようやく糸と影が、ひとまず全体らしき形を組み上げた。</p>
<p data-source-paragraph="4">一つの角が別の線につながり、一つの影が別の空白を埋めた。断片がついに見覚えのある何かをつくり上げ、私たちの謎解きは終わった。きっとあなたも、こう思うだろう。手がかりが十分にあり、十分に近づきさえすれば、ぼんやりした輪郭も、いつかは自分の定義を得るのだと。</p>
<p data-source-paragraph="5">私は歩みを止め、霞に向かって目を細め、輪郭をもっとはっきり見ようとした。あと少し注意深く見れば、すべては私の視線に従うはずだった。</p>
<p data-source-paragraph="6">ところが、集まったばかりの線は、おとなしくその場にとどまる気がないようだった。目の前の形は人のようにも、何かの植物のようにも見えた。ある影に顔を見いだしたばかりなのに、次の瞬間には、霧の流れとともに目鼻が消えてしまう。自分が実際には何を見ているのか、私にはわからなかった。</p>
<p data-source-paragraph="7">やがて、一つの輪郭がだんだん人の姿に近づいていった。ただ、その身体の比率はひどく奇妙だった。単純な線が、何気なく歪められ、組み合わされたように見えるのに、不思議にも一人の若い女性と一挺のマンドリンを形づくっていた。女性は椅子に座り、身体を少し片側へ傾けていた。その身体には、はっきりした境界がなかった。肩も腕も胴体も、一度ばらばらにされ、つなぎ直されたかのようで、ひと目には人形に近かった。淡い青、薄紫、黄色の色面が押し合い、数本の曲がった黒い線に、かろうじて隔てられていた。肩がどこで終わり、腕がどこから始まるのか、私にはほとんど指し示せなかった。ある曲線は身体の外縁をなぞっているかと思うと、次の瞬間には別の色面へ入り込み、まったく違う部分の境界になった。両腕は椅子の両側に沿って垂れ、その下にはマンドリンが横たわっているようだった。</p>
<p data-source-paragraph="8">視線を上げ、女性の頭を見つめた。ひと続きの曲線が横顔を描いていた。額から鼻筋へとゆっくり伸び、鼻先がわずかに上を向き、唇は固く結ばれ、顎では急に線がすぼまった。額から反対の方向へは、短い曲線が何本か後頭部に向かって伸びていた。ほどけた髪にも、霧からまだ分かれきっていない痕跡にも見えた。鼻の両側にある線が、女性の閉じた両目を形づくっていた。</p>
<p data-source-paragraph="9">けれど、横顔をこちらへ向けている女性の両目が、どうして同時に見えるのだろう？</p>
<p data-source-paragraph="10">まばたきをしても、二つの目はそこにあった。霧の中で静止しているかのようだった。指を上げて空中をなぞり、目の前の線を写し取ろうとした。片目を細め、もう片方の視線を指先の向こうへ通し、女性の鼻筋に沿って、横顔が本来向いているはずの方向をもう一度探した。どこか不思議な角度で、自分の理解では現れるはずの像に線を重ね合わせられれば、目の前の景色を理解できるようになるのだった。</p>
<p data-source-paragraph="11">つい先ほどまで明瞭だった曲線が、私の視線につれて、そっと位置を変えたように見えた。彼女はなお横を向いていて、それでいて、なお私の正面を向いていた。一か所を見つめると、別の場所がその隙に位置を変えるかのようだった。私は顔を伏せ、また上げた。目の前の線が、霧とともにひそかに動いているのかもしれない。指と曲線を視線に対して水平にそろえようとしても、どうしてもできなかった。椅子は動いていない。マンドリンも動いていない。まわりの霧さえ、その場で凍りついたようだった。それなのに、彼女の顔は、もう少し前とは違っていた。</p>
<p data-source-paragraph="12">不思議なことに、私はこのすべてを、それほど不思議だとは感じていなかった。</p>
<p data-source-paragraph="13">待って……あの輪郭は、本当に女性なのだろうか？</p>
<p data-source-paragraph="14">もしかすると、私は一度も彼女を見分けてなどいなかったのかもしれない。彼女を組み立て直していたのかもしれない。けれど、どのようにしてこの女性が目の前に現れたのか、思い出せなかった。曲線が描く輪郭、色面が組み上げる身体。彼女は、定義のない断片から、ごく自然に「集められた」ようだった。何かの偶然なのか、あるいは、見る前からいくつかの概念が私の心を占めていたのかもしれない。目の前の光景には、すでに名前が与えられていたのだ。《マンドリンを持つ若い女性》。</p>
<p data-source-paragraph="15">ああ、霧が少し薄れた。名前が現れると、定義されていなかった色面は自らの定義を示し、私の視界に固定された。もう、幾重もの霧の奥に隠れて、不確かに漂ってはいなかった。名前がもたらした定義は一本の鉄釘のように、すべての輪郭を、霧でできた壁に打ち留めた。つい先ほどまで植物や人形の一部だったかもしれない断片は、いまや女性とマンドリンの像しかつくれなかった。私にはもう、それ以外の何かとしては見えなかった。霧がもう少し薄れ、目の前の光景に確かさがもう一つ加わった。それとともに、何かもまた、そっと消えたようだった。</p>
<p data-source-paragraph="16">それは混沌だったのかもしれない。謎、神秘だったのかもしれない。小径の果てにある、誰も足を踏み入れたことのない場所。まだ落とされていないひと筆。運命にまだ錨を下ろされていない軌跡だったのかもしれない。</p>
<p data-source-paragraph="17">私は目の前の線と面を見つめ、「女性」と思わないように、「マンドリン」とも思わないように、自分に言い聞かせた。けれど、もう遅かった。楽器の胴をただの楕円として、頭をただの曲線として見ることは、もうできなかった。</p>
<p data-source-paragraph="18">読者よ、もし私がこの作品の名前を一度もあなたに伝えていなかったら、あなたはこれらの断片を、どのように組み上げただろう？</p>
</div>

<template data-essay-language="fr" data-essay-lang="fr">
<h1>Au cœur de la brume</h1>
<div class="essay-body" lang="fr">
<p class="essay-byline">Qihang</p>
<p data-source-paragraph="2">La lumière de l’aube tomba dans la brume. Dispersée par d’innombrables gouttelettes, elle s’y dissolvait uniformément, ne laissant qu’une clarté sans limites. Le paysage lointain s’y cachait, ses couleurs indiscernables, ses textures impossibles à distinguer.</p>
<p data-source-paragraph="3">Je marchais dans la brume, tandis que des contours flous se détachaient peu à peu du lointain nébuleux, traçant des segments discontinus. Ces fragments épars s’assemblaient lentement en une arête saillante, une ligne sinueuse, ou peut-être une forme singulière. Ils se prolongeaient dans la brume comme des fils abstraits, et chacun de mes pas en faisait se croiser quelques-uns. Ce n’est que lorsque les contours voilés furent assez proches pour presque effleurer le bout de mon nez que les fils et les ombres construisirent une forme en apparence complète.</p>
<p data-source-paragraph="4">Une arête rejoignit une autre ligne, une tache d’ombre combla un autre espace vide. Ces fragments finirent par composer quelque chose de reconnaissable, et notre jeu de devinettes prit fin. Vous penseriez sans doute la même chose : pourvu que les indices soient assez nombreux, pourvu que nous nous approchions suffisamment, un contour flou finira par acquérir sa définition.</p>
<p data-source-paragraph="5">Je m’arrêtai, plissai les yeux dans la brume et tentai de mieux voir ces contours. Avec un peu plus d’attention, tout se soumettrait à mon regard.</p>
<p data-source-paragraph="6">Pourtant, les lignes qui venaient de s’assembler ne semblaient pas disposées à rester en place. La forme devant moi ressemblait à une personne, puis à une sorte de plante ; une tache d’ombre venait de me laisser reconnaître un visage, et déjà ses traits disparaissaient avec le mouvement de la brume. Je ne savais pas ce que je voyais réellement.</p>
<p data-source-paragraph="7">Peu à peu, l’un des contours se mit à ressembler à une figure humaine, bien que les proportions de son corps fussent particulièrement étranges. Des lignes simples, après des déformations et des assemblages apparemment désinvoltes, avaient fini, on ne sait comment, par former une jeune femme et une mandoline. La jeune femme était assise sur une chaise, le corps légèrement incliné sur le côté. Ce corps n’avait pas de limites nettes. Ses épaules, ses bras et son torse semblaient avoir été démontés puis réassemblés, si bien qu’à première vue elle ressemblait davantage à une marionnette. Des plages de bleu pâle, de violet clair et de jaune se pressaient les unes contre les autres, à peine séparées par quelques lignes noires courbes. J’aurais eu du mal à dire où finissaient ses épaules et où commençaient ses bras. Certaines courbes semblaient un instant dessiner le bord extérieur du corps, puis se glissaient dans une autre plage de couleur et devenaient la limite d’une partie tout à fait différente. Ses bras paraissaient tomber de chaque côté de la chaise, tandis que la mandoline reposait horizontalement plus bas.</p>
<p data-source-paragraph="8">Je levai les yeux pour examiner la tête de la femme. Une courbe continue dessinait son profil : le front se prolongeait doucement vers l’arête du nez, dont la pointe se relevait légèrement ; les lèvres étaient serrées, puis la ligne se resserrait soudain au menton. Du front, dans l’autre direction, plusieurs courbes plus courtes s’étiraient vers l’arrière de la tête, pareilles à des mèches défaites, ou peut-être à des traces qui ne s’étaient pas encore entièrement détachées de la brume. De chaque côté du nez, des lignes formaient les yeux fermés de la femme.</p>
<p data-source-paragraph="9">Mais pourquoi pouvais-je voir ses deux yeux, alors que cette femme me présentait son profil ?</p>
<p data-source-paragraph="10">Je clignai des yeux. Les deux yeux étaient toujours là, comme figés dans la brume. Je levai un doigt et dessinai dans l’air, tentant de reproduire les lignes devant moi. Je plissai un œil et laissai le regard de l’autre passer au-delà du bout de mon doigt, suivant l’arête du nez de la femme pour chercher à nouveau la direction dans laquelle son profil aurait dû être tourné. Dès que je parvenais, sous quelque angle singulier, à faire coïncider les lignes avec l’image qui aurait dû apparaître selon ma propre compréhension, la scène devenait intelligible.</p>
<p data-source-paragraph="11">La courbe, si nette quelques instants plus tôt, semblait maintenant se déplacer légèrement avec mon regard. Elle était toujours tournée de côté, mais elle me faisait toujours face. Comme si, chaque fois que je fixais une partie, une autre profitait de l’occasion pour changer de place. Je baissai la tête, puis la relevai. Peut-être les lignes se déplaçaient-elles secrètement avec la brume. Malgré mes efforts pour aligner horizontalement mon doigt et la courbe avec mon regard, je n’y arrivais jamais tout à fait. La chaise n’avait pas bougé. La mandoline n’avait pas bougé. Même la brume autour de moi semblait figée. Pourtant, son visage était déjà un peu différent de ce qu’il avait été quelques instants auparavant.</p>
<p data-source-paragraph="12">Étrangement, rien de tout cela ne me paraissait particulièrement étrange.</p>
<p data-source-paragraph="13">Un instant… ce contour était-il vraiment celui d’une femme ?</p>
<p data-source-paragraph="14">Peut-être ne l’avais-je jamais reconnue. Peut-être étais-je en train de la reconstruire. Mais je ne me souvenais pas de la manière dont cette femme était apparue devant moi. Un contour tracé par des courbes, un corps assemblé à partir de plages de couleur : elle semblait s’être si naturellement « rassemblée » à partir de ces fragments indéfinis. Peut-être était-ce une coïncidence, ou peut-être certaines idées s’étaient-elles déjà emparées de mon esprit avant même que je commence à regarder : la scène devant moi avait déjà reçu un nom, Jeune femme à la mandoline.</p>
<p data-source-paragraph="15">Ah, la brume s’éclaircit un peu. Avec l’arrivée du nom, les plages indéfinies révélèrent leur définition et se fixèrent dans mon regard. Elles ne flottaient plus dans l’incertitude, cachées derrière des couches de brume. La définition apportée par le nom était comme un clou de fer, épinglant chaque contour sur un mur fait de brume. Des fragments qui, un instant plus tôt, auraient encore pu appartenir à une plante ou à une marionnette ne pouvaient désormais construire que l’image d’une femme et d’une mandoline. Je ne pouvais plus y voir autre chose. La brume s’éclaircit encore, ajoutant un degré de certitude à la scène ; mais quelque chose semblait aussi disparaître silencieusement avec elle.</p>
<p data-source-paragraph="16">Peut-être était-ce le chaos, une énigme, un mystère ; peut-être un lieu au bout d’un sentier où personne n’avait jamais posé le pied, un trait qui attendait encore de se poser, une trajectoire que le destin n’avait pas encore ancrée.</p>
<p data-source-paragraph="17">Je fixai les lignes et les plans devant moi, me forçant à ne penser ni à une « femme » ni à une « mandoline ». Mais il était trop tard. Je ne pouvais plus voir dans le corps de l’instrument un simple ovale, ni dans la tête une simple courbe.</p>
<p data-source-paragraph="18">Cher lecteur, si je ne vous avais jamais révélé le nom de cette œuvre, comment auriez-vous construit ces fragments ?</p>
</div>
